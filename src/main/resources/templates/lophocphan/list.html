<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content}, 'Quản lý Lớp học phần')}">

<body>
<th:block th:fragment="content">

    <style>
        .card{
            border:none;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 6px 18px rgba(15,23,42,.06);
        }

        .card-header{
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            color:#fff;
            padding:16px 20px;
            border:none;
        }

        .card-header span{
            font-size:16px;
            font-weight:700;
        }

        .btn-add{
            background:#fff;
            color:#2563eb !important;
            border:none;
            border-radius:10px;
            font-weight:600;
            padding:8px 14px;
        }

        .btn-add:hover{
            background:#eff6ff;
        }

        .toolbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            margin-bottom:16px;
        }

        .search-box{
            position:relative;
            width:360px;
            margin-left:auto;
        }

        .search-icon{
            position:absolute;
            left:14px;
            top:50%;
            transform:translateY(-50%);
            color:#94a3b8;
            font-size:14px;
        }

        .search-input{
            padding-left:40px;
            border-radius:12px;
            border:1px solid #e2e8f0;
            height:42px;
        }

        .search-input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,.12);
        }

        .table td{
            vertical-align:middle;
        }

        .action-buttons{
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }

       /* ═══════════════════════════════════════
   DELETE MODAL MODERN
═══════════════════════════════════════ */

/* nền blur thật */

.delete-modal{
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);

    background:rgba(15,23,42,.08);

    z-index:99999;
}

/* backdrop bootstrap */

.modal-backdrop.show{
    opacity:0 !important;
}

/* modal nằm phía trên */

.delete-modal .modal-dialog{
    max-width:380px;
    margin:28px auto auto;
}



/* content */
.delete-modal .modal-content{
    border:none;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    box-shadow:
        0 25px 60px rgba(0,0,0,.22);

    animation:modalShow .22s ease;
}

/* animation */
@keyframes modalShow{
    from{
        opacity:0;
        transform:translateY(-14px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* HEADER */

.delete-header{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    padding:18px 18px 14px;
    text-align:center;
    color:#fff;
    position:relative;
}

.delete-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto auto 10px;

    font-size:20px;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.15);
}

.delete-header h5{
    margin:0;
    font-size:20px;
    font-weight:800;
}

.delete-sub{
    margin-top:4px;
    font-size:12px;
    opacity:.92;
}

/* BODY */

.delete-body{
    padding:18px;
    text-align:center;
}

.delete-body p{
    font-size:13px;
    color:#64748b;
    margin-bottom:14px;
    line-height:1.5;
}

/* info box */

.delete-info{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:12px;
}

.delete-info-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:5px 0;
    font-size:13px;
}

.delete-info-label{
    color:#64748b;
    font-weight:700;
}

.delete-info-value{
    color:#0f172a;
    font-weight:700;
    text-align:right;
    max-width:180px;
    word-break:break-word;
}

.delete-info code{
    background:#fee2e2;
    color:#dc2626;
    border-radius:7px;
    padding:2px 7px;
    font-size:11px;
    font-weight:700;
}

/* footer */

.delete-modal .modal-footer{
    border:none;
    padding:0 18px 18px;
    display:flex;
    gap:10px;
}

/* buttons */

.btn-cancel{
    flex:1;
    border:none;
    background:#f1f5f9;
    color:#334155;

    border-radius:12px;

    height:42px;

    font-size:13px;
    font-weight:700;

    transition:.2s;
}

.btn-cancel:hover{
    background:#e2e8f0;
}

.btn-delete-confirm{
    flex:1;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#ef4444,#dc2626);

    color:#fff;

    height:42px;

    font-size:13px;
    font-weight:700;

    transition:.2s;

    box-shadow:
        0 10px 20px rgba(239,68,68,.24);
}

.btn-delete-confirm:hover{
    transform:translateY(-1px);

    box-shadow:
        0 14px 26px rgba(239,68,68,.30);
}

/* ICON BUTTONS TABLE */

.action-buttons .btn{
    width:34px;
    height:34px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.18s;
}

.action-buttons .btn:hover{
    transform:translateY(-2px);
}

/* hover từng nút */

.btn-outline-primary:hover{
    box-shadow:0 8px 18px rgba(37,99,235,.18);
}

.btn-outline-warning:hover{
    box-shadow:0 8px 18px rgba(245,158,11,.20);
}

.btn-outline-danger:hover{
    box-shadow:0 8px 18px rgba(239,68,68,.20);
}

/* RESPONSIVE */

@media(max-width:576px){

    .delete-modal .modal-dialog{
        margin:16px;
    }

    .delete-info-value{
        max-width:120px;
        font-size:12px;
    }
}
    </style>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
           <span class="d-flex align-items-center gap-2">
    <i class="fas fa-clipboard-list"></i>
    Danh sách Lớp học phần
    <span class="badge rounded-pill bg-white text-primary fw-bold"
          id="lhpCountBadge"
          th:text="${#lists.size(lopHocPhans)}"
          style="font-size:13px; min-width:28px">0</span>
</span>

            <a th:href="@{/admin/lop-hoc-phan/them}" class="btn btn-add btn-sm">
                <i class="fas fa-plus me-1"></i>Mở lớp mới
            </a>
        </div>

        <div class="card-body">

            <div class="toolbar">
                <form method="get" class="d-flex gap-2 align-items-center">
                    <label class="fw-semibold">Học kỳ:</label>

                    <select name="hocKy"
                            class="form-select"
                            style="width:180px"
                            onchange="this.form.submit()">
                        <option value="">-- Tất cả --</option>
                        <option th:each="hk:${danhSachHocKy}"
                                th:value="${hk}"
                                th:text="${hk}"
                                th:selected="${hk==hocKyChon}">
                        </option>
                    </select>

                    <a th:href="@{/admin/lop-hoc-phan}"
                       class="btn btn-outline-secondary btn-sm">
                        Reset
                    </a>
                </form>

                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text"
                           id="searchInput"
                           class="form-control search-input"
                           placeholder="Tìm kiếm...">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã LHP</th>
                        <th>Môn học</th>
                        <th>Giảng viên</th>
                        <th>Học kỳ</th>
                        <th>Sĩ số</th>
                        <th>Trạng thái</th>
                        <th>Thời gian ĐK</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(lopHocPhans)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="fas fa-inbox fa-2x d-block mb-2"></i>
                            Không có dữ liệu
                        </td>
                    </tr>

                    <tr th:each="lhp,i : ${lopHocPhans}">
                        <td th:text="${i.count}"></td>
                        <td><code th:text="${lhp.maLhp}"></code></td>
                        <td th:text="${lhp.monHoc.tenMon}"></td>
                        <td th:text="${lhp.giangVien.hoTen}"></td>

                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${lhp.hocKy}">
                            </span>
                        </td>

                        <td th:text="${lhp.siSoHienTai + (lhp.siSoMax > 0 ? '/' + lhp.siSoMax : '/∞')}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${lhp.trangThai.name()=='MO'?'bg-success':lhp.trangThai.name()=='DONG'?'bg-warning':'bg-danger'}"
                                  th:text="${lhp.trangThai}">
                            </span>
                        </td>
                        <td>
                            <span th:if="${lhp.thoiGianMo != null or lhp.thoiGianDong != null}"
                                  class="countdown-badge"
                                  th:data-mo="${lhp.thoiGianMo}"
                                  th:data-dong="${lhp.thoiGianDong}"
                                  style="font-size:11px;color:var(--bs-secondary)">
                                Đang tính...
                            </span>
                            <span th:unless="${lhp.thoiGianMo != null or lhp.thoiGianDong != null}"
                                  class="text-muted" style="font-size:11px">—</span>
                        </td>

                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/admin/lop-hoc-phan/{id}/danh-sach(id=${lhp.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-users"></i>
                                </a>

                                <a th:href="@{/admin/lop-hoc-phan/sua/{id}(id=${lhp.id})}"
                                   class="btn btn-sm btn-outline-warning">
                                    <i class="fas fa-edit"></i>
                                </a>

                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal"
                                        data-bs-target="#deleteModal"
                                        th:attr="
                                            data-id=${lhp.id},
                                            data-malhp=${lhp.maLhp},
                                            data-monhoc=${lhp.monHoc.tenMon},
                                            data-giangvien=${lhp.giangVien.hoTen},
                                            data-hocky=${lhp.hocKy}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- modal delete -->
    <div class="modal fade delete-modal"
         id="deleteModal"
         tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="delete-header">
                    <div class="delete-icon">
                        <i class="fas fa-trash-alt"></i>
                    </div>
                    <h5>Xóa lớp học phần</h5>
                    <div class="delete-sub">Hành động này không thể hoàn tác</div>
                </div>

                <div class="delete-body">
                    <p>Bạn có chắc muốn xóa lớp học phần này?</p>

                    <div class="delete-info">
                        <div class="delete-info-item">
                            <span class="delete-info-label">Mã lớp</span>
                            <span class="delete-info-value"><code id="deleteMaLhp"></code></span>
                        </div>

                        <div class="delete-info-item">
                            <span class="delete-info-label">Môn học</span>
                            <span class="delete-info-value" id="deleteMonHoc"></span>
                        </div>

                        <div class="delete-info-item">
                            <span class="delete-info-label">Giảng viên</span>
                            <span class="delete-info-value" id="deleteGiangVien"></span>
                        </div>

                        <div class="delete-info-item">
                            <span class="delete-info-label">Học kỳ</span>
                            <span class="delete-info-value" id="deleteHocKy"></span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-light btn-cancel"
                            data-bs-dismiss="modal">
                        Hủy
                    </button>

                    <form id="deleteForm" method="post" class="flex-fill">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button type="submit" class="btn btn-delete-confirm w-100">
                            <i class="fas fa-trash me-1"></i>Xóa
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        const deleteModal = document.getElementById('deleteModal');

        deleteModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;

            const id        = button.getAttribute('data-id');
            const maLhp     = button.getAttribute('data-malhp');
            const monHoc    = button.getAttribute('data-monhoc');
            const giangVien = button.getAttribute('data-giangvien');
            const hocKy     = button.getAttribute('data-hocky');

            const shortText = (text, max = 32) => {
                if (!text) return '';
                return text.length > max ? text.substring(0, max) + '...' : text;
            };

            document.getElementById('deleteMaLhp').textContent = maLhp;
            document.getElementById('deleteMonHoc').textContent = shortText(monHoc, 35);
            document.getElementById('deleteGiangVien').textContent = shortText(giangVien, 28);
            document.getElementById('deleteHocKy').textContent = hocKy;

            document.getElementById('deleteMonHoc').title = monHoc;
            document.getElementById('deleteGiangVien').title = giangVien;

            document.getElementById('deleteForm').action =
                '/admin/lop-hoc-phan/xoa/' + id;
        });

        /* SEARCH REALTIME: CHỈ THEO MÃ LHP + HỌC KỲ */
        document.getElementById('searchInput').addEventListener('keyup', function () {
            const keyword = this.value.trim().toLowerCase();
            const rows = document.querySelectorAll('tbody tr');
            let hasResult = false;

            rows.forEach(row => {
                if (row.id === 'noResultRow' || row.querySelector('td[colspan]')) return;

                const cells = row.querySelectorAll('td');

                // cột:
                // 1 = mã LHP
                // 4 = học kỳ
                const maLhp = cells[1]?.innerText.toLowerCase() || '';
                const hocKy = cells[4]?.innerText.toLowerCase() || '';

                if (maLhp.includes(keyword) || hocKy.includes(keyword)) {
                    row.style.display = '';
                    hasResult = true;
                } else {
                    row.style.display = 'none';
                }
            });

            let emptyRow = document.getElementById('noResultRow');

            if (!hasResult && keyword !== '') {
                if (!emptyRow) {
                    emptyRow = document.createElement('tr');
                    emptyRow.id = 'noResultRow';
                    emptyRow.innerHTML = `
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="fas fa-search-minus fa-2x d-block mb-2 opacity-50"></i>
                            Không tìm thấy lớp học phần phù hợp
                        </td>
                    `;
                    document.querySelector('tbody').appendChild(emptyRow);
                }
            } else {
                if (emptyRow) emptyRow.remove();
            }
            const visible = [...document.querySelectorAll('tbody tr')]
                .filter(r => !r.id && !r.querySelector('td[colspan]') && r.style.display !== 'none').length;
            document.getElementById('lhpCountBadge').textContent = visible;
        });
    </script>
    <script>
        function formatCountdown(targetDate, label) {
            const diff = targetDate - Date.now();
            if (diff <= 0) return label + ': đã qua';
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            return `${label}: còn ${h}g ${m}p ${s}s`;
        }

        function updateCountdowns() {
            document.querySelectorAll('.countdown-badge').forEach(el => {
                const mo   = el.dataset.mo   ? new Date(el.dataset.mo)   : null;
                const dong = el.dataset.dong ? new Date(el.dataset.dong) : null;
                const now  = Date.now();

                // FIX: check mo TRUOC (lop chua mo), dong SAU (lop sap dong)
                if (mo && mo > now) {
                    el.textContent = formatCountdown(mo, 'Mở');
                    el.style.color = '#16a34a';
                } else if (dong && dong > now) {
                    el.textContent = formatCountdown(dong, 'Đóng');
                    el.style.color = '#dc2626';
                } else if (dong && dong <= now) {
                    el.textContent = 'Đã đóng ĐK';
                    el.style.color = '#64748b';
                }
            });
        }

        setInterval(updateCountdowns, 1000);
        updateCountdowns();
    </script>
</th:block>
</body>
</html>
