<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Thêm Chức Vụ Nhân Viên')}">
<main>
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center py-3 mb-3 border-bottom">
            <a th:href="@{/admin/nhan-vien/chi-tiet/{id}(id=${nhanVien.id})}"
               class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="mb-0 fw-bold" th:text="${tieuDe}">Thêm Chức Vụ</h4>
                <small class="text-muted">Nhân viên: <strong th:text="${nhanVien.hoTen}"></strong></small>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-info text-white fw-semibold">
                        <i class="bi bi-clock-history me-2"></i>Thông Tin Chức Vụ Đảm Nhiệm
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/nhan-vien/{id}/chuc-vu/them(id=${nhanVien.id})}"
                              th:object="${nvcv}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <!-- Chức vụ -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Chức Vụ <span class="text-danger">*</span></label>
                                    <select th:field="*{chucVu}" class="form-select"
                                            th:classappend="${#fields.hasErrors('chucVu')} ? 'is-invalid'">
                                        <option value="">-- Chọn chức vụ --</option>
                                        <option th:each="cv : ${dsChucVu}" th:value="${cv.id}" th:text="${cv.tenChucVu}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{chucVu}"></div>
                                </div>

                                <!-- Ngày bắt đầu -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Ngày Bắt Đầu <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{ngayBatDau}" class="form-control"
                                           th:classappend="${#fields.hasErrors('ngayBatDau')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:errors="*{ngayBatDau}"></div>
                                </div>

                                <!-- Ngày kết thúc -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Ngày Kết Thúc</label>
                                    <input type="date" th:field="*{ngayKetThuc}" class="form-control"/>
                                    <small class="text-muted">Để trống nếu đang đảm nhiệm</small>
                                </div>

                                <!-- Mô tả -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Mô Tả Vai Trò</label>
                                    <textarea th:field="*{moTa}" class="form-control" rows="2"
                                              placeholder="Mô tả chi tiết về vai trò, nhiệm vụ..."></textarea>
                                </div>

                                <!-- Ghi chú -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Ghi Chú</label>
                                    <input type="text" th:field="*{ghiChu}" class="form-control"
                                           placeholder="Ghi chú thêm nếu có..."/>
                                </div>

                                <!-- Là chức vụ chính -->
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch"
                                               th:field="*{laChucVuChinh}" id="laChucVuChinh"/>
                                        <label class="form-check-label fw-semibold" for="laChucVuChinh">
                                            <i class="bi bi-star-fill text-warning me-1"></i>
                                            Đây là chức vụ chính hiện tại
                                        </label>
                                        <div class="form-text">Nếu chọn, sẽ tự động bỏ đánh dấu chức vụ chính cũ</div>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4"/>
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/admin/nhan-vien/chi-tiet/{id}(id=${nhanVien.id})}"
                                   class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle me-1"></i>Hủy
                                </a>
                                <button type="submit" class="btn btn-info text-white px-4">
                                    <i class="bi bi-save me-1"></i>Lưu Chức Vụ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
