<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<title>Tài Khoản Của Tôi</title>
<main>
    <div class="container-fluid px-4">

        <div th:if="${thanhCong}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${thanhCong}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${loiLam}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${loiLam}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="py-3 mb-3 border-bottom">
            <h5 class="mb-0 fw-bold"><i class="bi bi-person-circle me-2 text-primary"></i>Tài Khoản Của Tôi</h5>
        </div>

        <div class="row g-4 justify-content-center">
            <!-- Card thông tin -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm text-center p-4">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white fs-1 mx-auto mb-3"
                         th:style="'width:80px;height:80px;background:' +
               (${nguoiDung.vaiTro.name()} == 'ADMIN' ? '#c0392b' :
                ${nguoiDung.vaiTro.name()} == 'GIANG_VIEN' ? '#2d6a9f' :
                ${nguoiDung.vaiTro.name()} == 'NHAN_VIEN' ? '#27ae60' : '#0c9c8c')"
                         th:text="${nguoiDung.chuCaiDau}">N</div>
                    <h5 class="fw-bold mb-1" th:text="${nguoiDung.hoTen}">Họ Tên</h5>
                    <div class="text-muted mb-2"><code th:text="${nguoiDung.username}"></code></div>
                    <span th:class="'badge bg-' + ${nguoiDung.vaiTro.mauSac} + '-subtle text-' + ${nguoiDung.vaiTro.mauSac} + ' border border-' + ${nguoiDung.vaiTro.mauSac} + '-subtle'"
                          th:text="${nguoiDung.vaiTro.nhanHienThi}"></span>
                    <hr/>
                    <div class="text-start small">
                        <div class="d-flex align-items-center gap-2 mb-2" th:if="${nguoiDung.email}">
                            <i class="bi bi-envelope text-muted"></i>
                            <span th:text="${nguoiDung.email}"></span>
                        </div>
                        <div class="d-flex align-items-center gap-2" th:if="${nguoiDung.soDienThoai}">
                            <i class="bi bi-phone text-muted"></i>
                            <span th:text="${nguoiDung.soDienThoai}"></span>
                        </div>
                        <div class="text-muted mt-2">
                            <i class="bi bi-calendar3 me-1"></i>Tham gia:
                            <span th:text="${nguoiDung.ngayTao != null ? #temporals.format(nguoiDung.ngayTao,'dd/MM/yyyy') : '—'}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Đổi mật khẩu -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <span class="fw-semibold text-warning"><i class="bi bi-key me-2"></i>Đổi Mật Khẩu</span>
                    </div>
                    <div class="card-body p-4">
                        <form action="/tai-khoan/doi-mat-khau" th:object="${doiMatKhauDTO}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">MẬT KHẨU HIỆN TẠI</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{matKhauCu}" class="form-control"
                                           th:classappend="${#fields.hasErrors('matKhauCu')} ? 'is-invalid'"
                                           placeholder="Nhập mật khẩu hiện tại" id="pw1"/>
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePw('pw1',this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" th:errors="*{matKhauCu}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">MẬT KHẨU MỚI</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" th:field="*{matKhauMoi}" class="form-control"
                                           th:classappend="${#fields.hasErrors('matKhauMoi')} ? 'is-invalid'"
                                           placeholder="Tối thiểu 6 ký tự, có chữ hoa + số" id="pw2"
                                           oninput="checkMatch()"/>
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePw('pw2',this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" th:errors="*{matKhauMoi}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-muted">XÁC NHẬN MẬT KHẨU MỚI</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" th:field="*{xacNhanMatKhau}" class="form-control"
                                           th:classappend="${#fields.hasErrors('xacNhanMatKhau')} ? 'is-invalid'"
                                           placeholder="Nhập lại mật khẩu mới" id="pw3"
                                           oninput="checkMatch()"/>
                                    <button type="button" class="btn btn-outline-secondary" onclick="togglePw('pw3',this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" th:errors="*{xacNhanMatKhau}"></div>
                                </div>
                                <div id="matchMsg" class="form-text"></div>
                            </div>

                            <button type="submit" class="btn btn-warning text-white w-100">
                                <i class="bi bi-arrow-repeat me-1"></i>Đổi Mật Khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePw(id, btn) {
            const el = document.getElementById(id);
            const ic = btn.querySelector('i');
            el.type = el.type === 'password' ? 'text' : 'password';
            ic.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        }

        function checkMatch() {
            const pw2 = document.getElementById('pw2').value;
            const pw3 = document.getElementById('pw3').value;
            const msg = document.getElementById('matchMsg');
            if (!pw3) { msg.textContent = ''; return; }
            if (pw2 === pw3) {
                msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Mật khẩu khớp</span>';
            } else {
                msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>Mật khẩu chưa khớp</span>';
            }
        }
    </script>
</main>
</html>
