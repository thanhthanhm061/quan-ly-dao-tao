<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content}, 'Quản lý Môn học')}">
<body>
<th:block th:fragment="content">

    <!-- ── STATS ROW ── -->
    <div class="stats-row mb-4">
        <div class="stat-card">
            <div class="stat-icon bg-blue">
                <i class="fas fa-book"></i>
            </div>
            <div>
                <div class="stat-value" id="totalCount"
                     th:text="${#lists.size(monHocs)}">0</div>
                <div class="stat-label">Tổng môn học</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-amber">
                <i class="fas fa-layer-group"></i>
            </div>
            <div>
                <div class="stat-value" th:text="${totalCredits}">0</div>
                <div class="stat-label">Tổng tín chỉ</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-primary">
                <i class="fas fa-chalkboard"></i>
            </div>
            <div>
                <div class="stat-value" th:text="${lyTHuyetCount}">0</div>
                <div class="stat-label">Lý thuyết</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-success">
                <i class="fas fa-flask"></i>
            </div>
            <div>
                <div class="stat-value" th:text="${thucHanhCount}">0</div>
                <div class="stat-label">Thực hành</div>
            </div>
        </div>
    </div>

    <!-- ── MAIN CARD ── -->
    <div class="card custom-card">

        <!-- Header -->
        <div class="card-header custom-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold fs-5 d-flex align-items-center gap-2">
                <i class="fas fa-book"></i>
                Danh sách Môn học
                <span class="count-badge" id="headerBadge"
                      th:text="${#lists.size(monHocs)}">0</span>
            </span>

            <div class="d-flex gap-2">
                <button class="btn btn-light btn-sm export-btn" id="exportCsvBtn"
                        title="Xuất file CSV">
                    <i class="fas fa-file-csv me-1"></i>Xuất CSV
                </button>
                <a th:href="@{/admin/mon-hoc/them}" class="btn btn-light btn-sm add-btn">
                    <i class="fas fa-plus me-1"></i>Thêm mới
                </a>
            </div>
        </div>

        <div class="card-body">

            <!-- Toolbar: Search + Filter -->
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

                <!-- Filter pills -->
                <div class="filter-pills" id="filterPills">
                    <button class="pill active" data-filter="ALL">Tất cả</button>
                    <button class="pill" data-filter="LY_THUYET">
                        <span class="dot dot-primary"></span>Lý thuyết
                    </button>
                    <button class="pill" data-filter="THUC_HANH">
                        <span class="dot dot-success"></span>Thực hành
                    </button>
                    <button class="pill" data-filter="KHAC">
                        <span class="dot dot-secondary"></span>Khác
                    </button>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text"
                           id="searchInput"
                           class="form-control search-input"
                           placeholder="Tìm theo tên hoặc mã môn học...">
                    <button class="search-clear d-none" id="clearSearch" title="Xóa tìm kiếm">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="monHocTable">
                    <thead class="table-header">
                    <tr>
                        <th style="width:44px">#</th>
                        <th>Mã môn</th>
                        <th>Tên môn học</th>
                        <th style="width:90px">Tín chỉ</th>
                        <th style="width:120px">Loại</th>
                        <th>Khoa</th>
                        <th style="width:100px">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(monHocs)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-2x d-block mb-2 opacity-50"></i>
                            Không có dữ liệu
                        </td>
                    </tr>

                    <tr th:each="mon,i : ${monHocs}"
                        th:data-loai="${mon.loaiMon.name()}"
                        th:data-ma="${mon.maMon}"
                        th:data-ten="${mon.tenMon}">
                        <td class="text-muted small" th:text="${i.count}"></td>

                        <td>
                            <code class="ma-mon" th:text="${mon.maMon}"></code>
                        </td>

                        <td class="fw-semibold" th:text="${mon.tenMon}"></td>

                        <td>
                            <span class="badge bg-warning text-dark tc-badge"
                                  th:text="${mon.soTinChi}+' TC'"></span>
                        </td>

                        <td>
                            <span class="badge loai-badge"
                                  th:classappend="${mon.loaiMon.name()=='LY_THUYET'
                                    ? 'bg-primary'
                                    : mon.loaiMon.name()=='THUC_HANH'
                                    ? 'bg-success'
                                    : 'bg-secondary'}"
                                  th:text="${mon.loaiMon}">
                            </span>
                        </td>

                        <td class="small text-muted" th:text="${mon.khoa?.tenKhoa ?: '-'}"></td>

                        <td>
                            <div class="action-group">

                                <!-- EDIT -->
                                <a th:href="@{/admin/mon-hoc/sua/{id}(id=${mon.id})}"
                                   class="action-btn edit"
                                   title="Chỉnh sửa">

                                    <i class="fas fa-pen"></i>

                                </a>

                                <!-- DELETE -->
                                <form th:action="@{/admin/mon-hoc/xoa/{id}(id=${mon.id})}"
                                      method="post"
                                      class="delete-form"
                                      th:data-ten="${mon.tenMon}">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <button type="submit"
                                            class="action-btn delete"
                                            title="Xóa">

                                        <i class="fas fa-trash"></i>

                                    </button>

                                </form>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Result count footer -->
            <div class="result-footer" id="resultFooter">
                Hiển thị <strong id="visibleCount">0</strong> môn học
            </div>
        </div>
    </div>

    <!-- ── STYLES ── -->
    <style>
        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            border: 1px solid #f1f5f9;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .stat-icon.bg-blue {
            background: linear-gradient(135deg,#3b82f6,#1d4ed8);
        }

        .stat-icon.bg-amber {
            background: linear-gradient(135deg,#f59e0b,#d97706);
        }

        .stat-icon.bg-primary {
            background: linear-gradient(135deg,#6366f1,#4338ca);
        }

        .stat-icon.bg-success {
            background: linear-gradient(135deg,#10b981,#059669);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 3px;
        }

        /* Card */
        .custom-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .custom-header {
            background: linear-gradient(135deg,#1e3a8a,#2563eb);
            color: white;
            padding: 16px 22px;
            border: none;
        }

        /* Count badge in header */
        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 8px;
            background: white;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
        }

        /* Add / Export buttons */
        .add-btn,
        .export-btn {
            color: #1d4ed8 !important;
            font-weight: 600;
            border-radius: 10px;
            padding: 6px 14px;
            border: none;
            background: white;
            transition: .2s;
        }

        .add-btn:hover,
        .export-btn:hover {
            background: #eff6ff;
            color: #1e40af !important;
            transform: translateY(-1px);
        }

        /* Table header */
        .table-header {
            background: #eff6ff;
        }

        .table-header th {
            color: #1e3a8a;
            font-weight: 700;
            border-bottom: none;
            font-size: 13px;
        }

        /* Filter pills */
        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1.5px solid #e2e8f0;
            background: white;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
        }

        .pill:hover {
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .pill.active {
            background: #1d4ed8;
            color: white;
            border-color: #1d4ed8;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-primary {
            background: #6366f1;
        }

        .dot-success {
            background: #10b981;
        }

        .dot-secondary {
            background: #94a3b8;
        }

        /* Search */
        .search-box {
            position: relative;
            width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            padding-left: 42px;
            padding-right: 36px;
            border-radius: 14px;
            border: 1px solid #dbeafe;
            height: 44px;
            background: #f8fafc;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
            background: white;
        }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
        }

        .search-clear:hover {
            color: #ef4444;
        }

        /* ma-mon code style */
        code.ma-mon {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Result footer */
        .result-footer {
            font-size: 13px;
            color: #94a3b8;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            margin-top: 8px;
        }

        /* =======================================================
           ACTION BUTTONS - GIỐNG KHOA
        ======================================================= */

        .action-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: .22s;
            font-size: 13px;
            padding: 0;
            box-shadow: 0 6px 14px rgba(15,23,42,.05);
        }

        .action-btn i {
            line-height: 1;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* EDIT */

        .action-btn.edit {
            background: #fff7ed;
            color: #ea580c;
        }

        .action-btn.edit:hover {
            background: #f97316;
            color: #fff;
            box-shadow: 0 12px 24px rgba(249,115,22,.25);
        }

        /* DELETE */

        .action-btn.delete {
            background: #fef2f2;
            color: #dc2626;
        }

        .action-btn.delete:hover {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 12px 24px rgba(220,38,38,.25);
        }

        /* =======================================================
           DELETE MODAL + BACKDROP BLUR
        ======================================================= */

        .custom-toast-container {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 40px;

            background: rgba(15,23,42,.20);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            opacity: 0;
            transition: opacity .18s ease;
        }

        .custom-toast-container.show {
            display: flex;
            opacity: 1;
        }

        .custom-toast {
            width: 360px;
            background: rgba(255,255,255,.97);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,.18);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.7);
            animation: slideDown .22s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-16px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .toast-header-custom {
            display: flex;
            gap: 14px;
            padding: 20px 20px 12px;
        }

        .toast-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .toast-title {
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        .toast-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 0 20px 20px;
        }

        .toast-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .toast-btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .toast-btn-cancel:hover {
            background: #e2e8f0;
        }

        .toast-btn-confirm {
            background: linear-gradient(135deg,#ef4444,#dc2626);
            color: #fff;
            box-shadow: 0 10px 20px rgba(239,68,68,.22);
        }

        .toast-btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(239,68,68,.28);
        }

        /* Flash messages */
        .alert {
            border-radius: 12px;
            font-size: 14px;
        }

        /* Responsive */
        @media(max-width:768px){

            .search-box{
                width:100%;
            }

            .custom-toast{
                width:92%;
            }

        }
    </style>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="custom-toast-container"></div>

    <!-- ── SCRIPTS ── -->
    <script>
        /* ── helpers ── */
        const allRows = () => [...document.querySelectorAll('#monHocTable tbody tr[data-ma]')];

        function updateVisibleCount() {
            const n = allRows().filter(r => r.style.display !== 'none').length;
            document.getElementById('visibleCount').textContent = n;
            document.getElementById('headerBadge').textContent = n;
        }

        /* ── Init count ── */
        document.addEventListener('DOMContentLoaded', () => {
            updateVisibleCount();
        });

        /* ── Filter pills ── */
        let activeFilter = 'ALL';

        document.querySelectorAll('.pill').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.dataset.filter;
                applyFilters();
            });
        });

        /* ── Search ── */
        const searchInput = document.getElementById('searchInput');
        const clearBtn    = document.getElementById('clearSearch');

        searchInput.addEventListener('input', function () {
            clearBtn.classList.toggle('d-none', this.value.trim() === '');
            applyFilters();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('d-none');
            applyFilters();
            searchInput.focus();
        });

        function applyFilters() {
            const kw = searchInput.value.trim().toLowerCase();
            const rows = allRows();
            let hasResult = false;

            rows.forEach(row => {
                const ma  = (row.dataset.ma  || '').toLowerCase();
                const ten = (row.dataset.ten || '').toLowerCase();
                const loai = row.dataset.loai || '';

                const matchSearch = !kw || ma.includes(kw) || ten.includes(kw);
                const matchFilter = activeFilter === 'ALL' || loai === activeFilter;

                if (matchSearch && matchFilter) {
                    row.style.display = '';
                    hasResult = true;
                } else {
                    row.style.display = 'none';
                }
            });

            /* empty state */
            let emptyRow = document.getElementById('noResultRow');
            if (!hasResult && rows.length > 0) {
                if (!emptyRow) {
                    emptyRow = document.createElement('tr');
                    emptyRow.id = 'noResultRow';
                    emptyRow.innerHTML = `
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-search fa-2x d-block mb-2 opacity-40"></i>
                            Không tìm thấy môn học phù hợp
                        </td>`;
                    document.querySelector('#monHocTable tbody').appendChild(emptyRow);
                }
            } else {
                if (emptyRow) emptyRow.remove();
            }

            updateVisibleCount();
        }

        /* ── Delete toast ── */
        function showDeleteToast(title, message, onConfirm) {

    const container =
        document.querySelector('.custom-toast-container');

    container.innerHTML = '';

    const toast = document.createElement('div');

    toast.className = 'custom-toast';

    toast.innerHTML = `
        <div class="toast-header-custom">

            <div class="toast-icon">
                <i class="fas fa-trash"></i>
            </div>

            <div>
                <div class="toast-title">${title}</div>

                <div class="toast-message">
                    ${message}
                </div>
            </div>

        </div>

        <div class="toast-actions">

            <button class="toast-btn toast-btn-cancel">
                Hủy
            </button>

            <button class="toast-btn toast-btn-confirm">
                Xóa
            </button>

        </div>
    `;

    container.appendChild(toast);

    container.style.display = 'flex';

    requestAnimationFrame(() => {
        container.classList.add('show');
    });

    function closeModal(){
        container.classList.remove('show');

        setTimeout(() => {
            container.style.display = 'none';
            container.innerHTML = '';
        }, 180);
    }

    toast.querySelector('.toast-btn-cancel')
        .onclick = closeModal;

    toast.querySelector('.toast-btn-confirm')
        .onclick = () => {
            closeModal();
            onConfirm();
        };

    container.onclick = (e) => {
        if(e.target === container){
            closeModal();
        }
    };
}

        document.querySelectorAll('.delete-form').forEach(form => {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                showDeleteToast(
                    'Xác nhận xóa',
                    `Bạn có chắc muốn xóa môn "<b>${this.dataset.ten}</b>"?`,
                    () => this.submit()
                );
            });
        });

         /* ── Export Excel đẹp ── */
    document.getElementById('exportCsvBtn').addEventListener('click', () => {

        const visibleRows =
            allRows().filter(r => r.style.display !== 'none');

        const now = new Date();

        const time =
            `${now.getDate().toString().padStart(2,'0')}/${
                (now.getMonth()+1).toString().padStart(2,'0')
            }/${now.getFullYear()}`;

        let html = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office"
              xmlns:x="urn:schemas-microsoft-com:office:excel"
              xmlns="http://www.w3.org/TR/REC-html40">

        <head>
            <meta charset="UTF-8">

            <!--[if gte mso 9]>
            <xml>
                <x:ExcelWorkbook>
                    <x:ExcelWorksheets>
                        <x:ExcelWorksheet>
                            <x:Name>Danh sách môn học</x:Name>
                            <x:WorksheetOptions>
                                <x:DisplayGridlines/>
                            </x:WorksheetOptions>
                        </x:ExcelWorksheet>
                    </x:ExcelWorksheets>
                </x:ExcelWorkbook>
            </xml>
            <![endif]-->

            <style>

                body{
                    font-family: Arial, sans-serif;
                }

                table{
                    border-collapse: collapse;
                    width: 100%;
                }

                .title{
                    font-size: 22px;
                    font-weight: bold;
                    color: #1e3a8a;
                    text-align: center;
                    padding: 18px;
                }

                .sub{
                    text-align: center;
                    color: #64748b;
                    font-size: 12px;
                    padding-bottom: 14px;
                }

                th{
                    background: #2563eb;
                    color: white;
                    font-weight: bold;
                    text-align: center;
                    border: 1px solid #cbd5e1;
                    padding: 10px;
                    font-size: 13px;
                }

                td{
                    border: 1px solid #cbd5e1;
                    padding: 9px;
                    font-size: 13px;
                    vertical-align: middle;
                }

                .center{
                    text-align: center;
                }

                .right{
                    text-align: right;
                }

                .code{
                    background: #eff6ff;
                    color: #1d4ed8;
                    font-weight: bold;
                }

                .lt{
                    background: #eef2ff;
                    color: #4338ca;
                    font-weight: bold;
                    text-align: center;
                }

                .th{
                    background: #ecfdf5;
                    color: #059669;
                    font-weight: bold;
                    text-align: center;
                }

                .khac{
                    background: #f1f5f9;
                    color: #475569;
                    font-weight: bold;
                    text-align: center;
                }

                .footer{
                    padding-top: 14px;
                    color: #64748b;
                    font-size: 12px;
                }

            </style>
        </head>

        <body>

            <table>

                <tr>
                    <td colspan="6" class="title">
                        DANH SÁCH MÔN HỌC
                    </td>
                </tr>

                <tr>
                    <td colspan="6" class="sub">
                        Xuất ngày: ${time}
                    </td>
                </tr>

                <tr>
                    <th style="width:60px">STT</th>
                    <th style="width:120px">Mã môn</th>
                    <th style="width:320px">Tên môn học</th>
                    <th style="width:90px">Tín chỉ</th>
                    <th style="width:140px">Loại môn</th>
                    <th style="width:240px">Khoa</th>
                </tr>
        `;

        visibleRows.forEach((row, idx) => {

            const cells =
                row.querySelectorAll('td');

            const ma =
                cells[1]?.innerText.trim() || '';

            const ten =
                cells[2]?.innerText.trim() || '';

            const tc =
                cells[3]?.innerText.trim() || '';

            const loai =
                cells[4]?.innerText.trim() || '';

            const khoa =
                cells[5]?.innerText.trim() || '';

            let loaiClass = 'khac';

            if(loai.includes('LY_THUYET')){
                loaiClass = 'lt';
            }

            if(loai.includes('THUC_HANH')){
                loaiClass = 'th';
            }

            html += `
                <tr>

                    <td class="center">
                        ${idx + 1}
                    </td>

                    <td class="code center">
                        ${ma}
                    </td>

                    <td>
                        ${ten}
                    </td>

                    <td class="center">
                        ${tc}
                    </td>

                    <td class="${loaiClass}">
                        ${loai}
                    </td>

                    <td>
                        ${khoa}
                    </td>

                </tr>
            `;
        });

        html += `
            </table>

            <div class="footer">
                Tổng số môn học: ${visibleRows.length}
            </div>

        </body>
        </html>
        `;

        const blob =
            new Blob(
                ['\ufeff' + html],
                {
                    type:
                        'application/vnd.ms-excel;charset=utf-8;'
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement('a');

        a.href = url;

        a.download =
            'danh-sach-mon-hoc.xls';

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    });
    </script>

</th:block>
</body>
</html>
