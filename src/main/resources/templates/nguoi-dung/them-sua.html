<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Quản lý Người Dùng')}">

<body>
<main>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap');

        :root{
            --primary:#2563eb;
            --primary-hover:#1d4ed8;
            --warning:#f59e0b;
            --danger:#ef4444;
            --success:#10b981;
            --bg:#f5f7fb;
            --border:#e5e7eb;
            --text:#111827;
            --muted:#6b7280;
        }

        body{
            background:var(--bg);
            font-family:'Be Vietnam Pro',sans-serif;
        }

        .page-header{
            display:flex;
            align-items:center;
            gap:16px;
            margin-bottom:24px;
        }

        .back-btn{
            width:42px;
            height:42px;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:white;
            border:none;
            box-shadow:0 4px 14px rgba(0,0,0,.06);
            transition:.2s;
        }

        .back-btn:hover{
            transform:translateY(-2px);
        }

        .main-card{
            border:none;
            border-radius:28px;
            overflow:hidden;
            background:white;
            box-shadow:0 10px 35px rgba(0,0,0,.05);
        }

        .main-card-header{
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            padding:22px 28px;
        }

        .main-card-header h5{
            margin:0;
            font-weight:700;
        }

        .main-card-body{
            padding:32px;
        }

        .form-label{
            font-size:13px;
            font-weight:700;
            color:#6b7280;
            margin-bottom:8px;
            letter-spacing:.3px;
        }

        .form-control,
        .form-select{
            min-height:50px;
            border-radius:16px;
            border:1px solid #dbe2ea;
            font-size:14px;
            box-shadow:none !important;
            transition:.2s;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#2563eb;
        }

        .input-group-text{
            border-radius:16px 0 0 16px;
            border:1px solid #dbe2ea;
            background:#f8fafc;
            color:#6b7280;
        }

        .input-group .btn{
            border-radius:0 16px 16px 0 !important;
        }

        .form-text{
            font-size:12px;
            color:#94a3b8;
        }

        textarea.form-control{
            min-height:100px;
            resize:none;
        }

        .btn{
            border-radius:14px;
            font-weight:600;
            padding:11px 18px;
            transition:.2s;
        }

        .btn-primary{
            background:#2563eb;
            border:none;
        }

        .btn-primary:hover{
            background:#1d4ed8;
            transform:translateY(-1px);
        }

        .btn-warning{
            background:#f59e0b;
            border:none;
        }

        .btn-warning:hover{
            background:#d97706;
        }

        .btn-outline-secondary{
            border:1px solid #d1d5db;
        }

        .account-alert{
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:20px;
            padding:18px;
        }

        .account-avatar{
            width:58px;
            height:58px;
            border-radius:50%;
            background:linear-gradient(135deg,#2563eb,#60a5fa);
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            font-weight:800;
            flex-shrink:0;
        }

        .switch-box{
            background:#f8fafc;
            border-radius:18px;
            padding:16px;
            border:1px solid #e2e8f0;
        }

        hr{
            opacity:.08;
        }

        .invalid-feedback{
            display:block;
        }

        @media(max-width:768px){

            .main-card-body{
                padding:22px;
            }

            .page-header{
                flex-wrap:wrap;
            }
        }

    </style>

    <div class="container-fluid px-4 py-4">

        <!-- HEADER -->
        <div class="page-header">

            <a href="/admin/nguoi-dung"
               class="back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>

            <div>
                <h4 class="fw-bold mb-1"
                    th:text="${tieuDe}">
                    Quản lý Người Dùng
                </h4>

                <div class="text-muted small">
                    Quản lý và cập nhật thông tin tài khoản
                </div>
            </div>

        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="main-card">

                    <!-- HEADER CARD -->
                    <div class="main-card-header">

                        <h5>
                            <i class="bi bi-person-lines-fill me-2"></i>
                            Thông Tin Tài Khoản
                        </h5>

                    </div>

                    <!-- BODY -->
                    <div class="main-card-body">

                        <!-- FORM THÊM -->
                        <form th:if="${dto != null}"
                              action="/admin/nguoi-dung/them"
                              th:object="${dto}"
                              method="post">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <div class="row g-4">

                                <!-- USERNAME -->
                                <div class="col-md-5">

                                    <label class="form-label">
                                        TÊN ĐĂNG NHẬP
                                        <span class="text-danger">*</span>
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-person"></i>
                                        </span>

                                        <input type="text"
                                               th:field="*{username}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                               placeholder="vd: gv001">

                                    </div>

                                    <div class="invalid-feedback"
                                         th:errors="*{username}">
                                    </div>

                                    <div class="form-text">
                                        Chỉ chữ thường, số, dấu _
                                    </div>

                                </div>

                                <!-- HỌ TÊN -->
                                <div class="col-md-7">

                                    <label class="form-label">
                                        HỌ VÀ TÊN
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           th:field="*{hoTen}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid'"
                                           placeholder="Nhập họ tên">

                                    <div class="invalid-feedback"
                                         th:errors="*{hoTen}">
                                    </div>

                                </div>

                                <!-- EMAIL -->
                                <div class="col-md-7">

                                    <label class="form-label">
                                        EMAIL
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>

                                        <input type="email"
                                               th:field="*{email}"
                                               class="form-control"
                                               placeholder="email@truong.edu.vn">

                                    </div>

                                </div>

                                <!-- PHONE -->
                                <div class="col-md-5">

                                    <label class="form-label">
                                        SỐ ĐIỆN THOẠI
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-phone"></i>
                                        </span>

                                        <input type="text"
                                               th:field="*{soDienThoai}"
                                               class="form-control"
                                               placeholder="0xxx xxx xxx">

                                    </div>

                                </div>

                                <!-- ROLE -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        VAI TRÒ
                                        <span class="text-danger">*</span>
                                    </label>

                                    <select th:field="*{vaiTro}"
                                            class="form-select">

                                        <option value="">
                                            -- Chọn vai trò --
                                        </option>

                                        <option th:each="vt : ${dsVaiTro}"
                                                th:value="${vt}"
                                                th:text="${vt.nhanHienThi}">
                                        </option>

                                    </select>

                                </div>

                                <!-- PASSWORD -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        MẬT KHẨU
                                        <span class="text-danger">*</span>
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-key"></i>
                                        </span>

                                        <input type="password"
                                               th:field="*{matKhau}"
                                               class="form-control"
                                               placeholder="Tối thiểu 6 ký tự"
                                               id="pwInput">

                                        <button class="btn btn-outline-secondary"
                                                type="button"
                                                onclick="togglePw('pwInput', this)">

                                            <i class="bi bi-eye"></i>

                                        </button>

                                    </div>

                                    <div class="form-text">
                                        Nên có chữ hoa + số
                                    </div>

                                </div>

                                <!-- NOTE -->
                                <div class="col-12">

                                    <label class="form-label">
                                        GHI CHÚ
                                    </label>

                                    <textarea th:field="*{ghiChu}"
                                              class="form-control"
                                              placeholder="Ghi chú về tài khoản..."></textarea>

                                </div>

                                <!-- ACTIVE -->
                                <div class="col-12">

                                    <div class="switch-box">

                                        <div class="form-check form-switch mb-0">

                                            <input class="form-check-input"
                                                   type="checkbox"
                                                   role="switch"
                                                   th:field="*{kichHoat}"
                                                   id="kichHoat"/>

                                            <label class="form-check-label fw-semibold"
                                                   for="kichHoat">

                                                Kích hoạt tài khoản ngay

                                            </label>

                                        </div>

                                    </div>

                                </div>

                            </div>

                            <hr class="my-4"/>

                            <!-- ACTION -->
                            <div class="d-flex gap-2 justify-content-end">

                                <a href="/admin/nguoi-dung"
                                   class="btn btn-outline-secondary">

                                    <i class="bi bi-x-circle me-1"></i>
                                    Hủy

                                </a>

                                <button type="submit"
                                        class="btn btn-primary px-4">

                                    <i class="bi bi-person-plus me-1"></i>
                                    Tạo Tài Khoản

                                </button>

                            </div>

                        </form>

                        <!-- FORM CẬP NHẬT -->
                        <form th:if="${nguoiDung != null and nguoiDung.id != null}"
                              th:action="@{/admin/nguoi-dung/sua/{id}(id=${nguoiDung.id})}"
                              th:object="${nguoiDung}"
                              method="post">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{username}">
                            <input type="hidden" th:field="*{matKhau}">

                            <!-- ACCOUNT -->
                            <div class="account-alert d-flex align-items-center gap-3 mb-4">

                                <div class="account-avatar"
                                     th:text="${#strings.substring(
                                     #strings.arraySplit(nguoiDung.hoTen,' ')
                                     [#strings.arraySplit(nguoiDung.hoTen,' ').length - 1],
                                     0,1).toUpperCase()}">
                                    H
                                </div>

                                <div>

                                    <div class="fw-bold"
                                         th:text="${nguoiDung.username}">
                                        username
                                    </div>

                                    <div class="text-muted small">
                                        Tên đăng nhập không thể thay đổi
                                    </div>

                                </div>

                            </div>

                            <div class="row g-4">

                                <!-- HỌ TÊN -->
                                <div class="col-12">

                                    <label class="form-label">
                                        HỌ VÀ TÊN
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           th:field="*{hoTen}"
                                           class="form-control">

                                </div>

                                <!-- EMAIL -->
                                <div class="col-md-7">

                                    <label class="form-label">
                                        EMAIL
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>

                                        <input type="email"
                                               th:field="*{email}"
                                               class="form-control">

                                    </div>

                                </div>

                                <!-- PHONE -->
                                <div class="col-md-5">

                                    <label class="form-label">
                                        SỐ ĐIỆN THOẠI
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-phone"></i>
                                        </span>

                                        <input type="text"
                                               th:field="*{soDienThoai}"
                                               class="form-control">

                                    </div>

                                </div>

                                <!-- ROLE -->
                                <div class="col-md-6">

                                    <label class="form-label">
                                        VAI TRÒ
                                    </label>

                                    <select th:field="*{vaiTro}"
                                            class="form-select">

                                        <option th:each="vt : ${dsVaiTro}"
                                                th:value="${vt}"
                                                th:text="${vt.nhanHienThi}">
                                        </option>

                                    </select>

                                </div>

                                <!-- ACTIVE -->
                                <div class="col-md-6">

                                    <div class="switch-box h-100 d-flex align-items-center">

                                        <div class="form-check form-switch mb-0">

                                            <input class="form-check-input"
                                                   type="checkbox"
                                                   role="switch"
                                                   th:field="*{kichHoat}"
                                                   id="kichHoat2"/>

                                            <label class="form-check-label fw-semibold"
                                                   for="kichHoat2">

                                                Tài khoản đang hoạt động

                                            </label>

                                        </div>

                                    </div>

                                </div>

                                <!-- NOTE -->
                                <div class="col-12">

                                    <label class="form-label">
                                        GHI CHÚ
                                    </label>

                                    <textarea th:field="*{ghiChu}"
                                              class="form-control"></textarea>

                                </div>

                            </div>

                            <hr class="my-4"/>

                            <!-- ACTION -->
                            <div class="d-flex gap-2 justify-content-end">

                                <a href="/admin/nguoi-dung"
                                   class="btn btn-outline-secondary">

                                    <i class="bi bi-x-circle me-1"></i>
                                    Hủy

                                </a>

                                <button type="submit"
                                        class="btn btn-warning text-white px-4">

                                    <i class="bi bi-save me-1"></i>
                                    Lưu Thay Đổi

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>

        function togglePw(inputId, btn) {

            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {

                input.type = 'text';
                icon.className = 'bi bi-eye-slash';

            } else {

                input.type = 'password';
                icon.className = 'bi bi-eye';

            }
        }

    </script>

</main>
</body>
</html>
