<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Chỉnh sửa lịch dạy bù')}">
<head><title>Chỉnh sửa lịch dạy bù</title></head>
<body>
<main>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --teal:       #0d9488;
            --teal-mid:   #0f766e;
            --teal-dark:  #115e59;
            --teal-50:    #f0fdfa;
            --teal-100:   #ccfbf1;
            --surface:    #ffffff;
            --bg:         #f8fafc;
            --border:     #e2e8f0;
            --border-mid: #cbd5e1;
            --text:       #0f172a;
            --text-2:     #334155;
            --text-3:     #64748b;
            --text-4:     #94a3b8;
            --red:        #e11d48;
            --red-bg:     #fff1f2;
            --r:          12px;
            --r-sm:       8px;
            --r-xs:       6px;
            --shadow-sm:  0 1px 2px rgba(0,0,0,.05);
            --shadow:     0 1px 3px rgba(0,0,0,.07), 0 6px 24px rgba(0,0,0,.06);
            --shadow-lg:  0 4px 6px rgba(0,0,0,.05), 0 12px 48px rgba(0,0,0,.1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        .slb-wrap {
            font-family: 'DM Sans', sans-serif;
            max-width: 820px;
            color: var(--text);
        }

        /* ── TOP BAR ── */
        .slb-top {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; margin-bottom: 28px;
        }
        .slb-heading { display: flex; align-items: center; gap: 14px; }
        .slb-icon-wrap {
            width: 46px; height: 46px; border-radius: var(--r);
            background: linear-gradient(135deg, var(--teal-mid), var(--teal-dark));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(13,148,136,.3);
            flex-shrink: 0;
        }
        .slb-icon-wrap i { color: #fff; font-size: 1.1rem; }
        .slb-title { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
        .slb-sub   { font-size: .78rem; color: var(--text-3); margin-top: 2px; }

        .slb-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'DM Sans', sans-serif; font-size: .82rem; font-weight: 600;
            color: var(--text-3); text-decoration: none;
            padding: 8px 14px; border-radius: var(--r-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            transition: all .15s; white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .slb-back:hover { color: var(--teal-mid); border-color: var(--teal-mid); background: var(--teal-50); }

        /* ── CARD ── */
        .slb-card {
            background: var(--surface);
            border-radius: var(--r);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* ── INFO STRIP (readonly) ── */
        .slb-strip {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 0; border-bottom: 1px solid var(--border);
            background: var(--teal-50);
        }
        .slb-strip-item {
            padding: 16px 22px;
            display: flex; align-items: center; gap: 12px;
        }
        .slb-strip-item:first-child { border-right: 1px solid var(--teal-100); }
        .slb-strip-ico {
            width: 36px; height: 36px; border-radius: var(--r-sm);
            background: var(--teal-100); color: var(--teal-mid);
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem; flex-shrink: 0;
        }
        .slb-strip-lbl { font-size: .68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .05em; color: var(--text-3); margin-bottom: 3px; }
        .slb-strip-val { font-size: .875rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .slb-strip-sub { font-size: .72rem; color: var(--text-3); margin-top: 2px; }

        /* ── FORM BODY ── */
        .slb-body { padding: 26px 24px; }

        .slb-section-lbl {
            display: flex; align-items: center; gap: 8px;
            font-size: .7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: var(--text-3);
            margin-bottom: 14px;
        }
        .slb-section-lbl::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        .slb-grid { display: grid; gap: 14px; margin-bottom: 20px; }
        .slb-grid-2 { grid-template-columns: 1fr 1fr; }
        .slb-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .slb-grid-1 { grid-template-columns: 1fr; }
        @media (max-width: 600px) {
            .slb-grid-2, .slb-grid-3 { grid-template-columns: 1fr; }
            .slb-strip { grid-template-columns: 1fr; }
            .slb-strip-item:first-child { border-right: none; border-bottom: 1px solid var(--teal-100); }
        }

        /* ── FIELDS ── */
        .slb-field label {
            display: flex; align-items: center; gap: 4px;
            font-size: .75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .04em;
            color: var(--text-2); margin-bottom: 7px;
        }
        .slb-field label .req { color: var(--red); font-size: .8rem; line-height: 1; }

        .slb-field input,
        .slb-field select,
        .slb-field textarea {
            width: 100%; padding: 10px 13px;
            border-radius: var(--r-sm);
            border: 1.5px solid var(--border);
            font-family: 'DM Sans', sans-serif;
            font-size: .875rem; color: var(--text);
            background: var(--surface);
            transition: border-color .15s, box-shadow .15s;
            outline: none; appearance: none;
        }
        .slb-field input[type="number"] {
            font-family: 'DM Mono', monospace; font-size: .9rem; text-align: center;
        }
        .slb-field input:focus,
        .slb-field select:focus,
        .slb-field textarea:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(13,148,136,.12);
        }
        .slb-field textarea { resize: vertical; min-height: 88px; line-height: 1.55; }
        .slb-field .hint {
            font-size: .71rem; color: var(--text-4); margin-top: 5px;
            display: flex; align-items: center; gap: 4px;
        }

        /* Number spinners styled */
        .slb-num-wrap { position: relative; }
        .slb-num-wrap input { padding-right: 36px; }
        .slb-num-badge {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            font-size: .65rem; color: var(--text-4); font-weight: 600;
            pointer-events: none; font-family: 'DM Mono', monospace;
        }

        /* ── DIVIDER ── */
        .slb-divider { height: 1px; background: var(--border); margin: 4px 0 20px; }

        /* ── ACTIONS ── */
        .slb-actions {
            display: flex; gap: 10px; justify-content: flex-end;
            padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px;
        }
        .slb-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 20px; border-radius: var(--r-sm);
            font-family: 'DM Sans', sans-serif; font-size: .875rem; font-weight: 600;
            cursor: pointer; text-decoration: none; border: 1.5px solid transparent;
            transition: all .15s; white-space: nowrap;
        }
        .slb-btn-ghost {
            background: var(--surface); color: var(--text-3); border-color: var(--border);
        }
        .slb-btn-ghost:hover { background: var(--bg); border-color: var(--border-mid); color: var(--text-2); }
        .slb-btn-primary {
            background: linear-gradient(135deg, var(--teal-mid), var(--teal-dark));
            color: #fff; border-color: transparent;
            box-shadow: 0 2px 8px rgba(13,148,136,.3);
        }
        .slb-btn-primary:hover {
            background: linear-gradient(135deg, var(--teal-dark), #0f4e4a);
            box-shadow: 0 4px 14px rgba(13,148,136,.4); transform: translateY(-1px);
        }
        .slb-btn-primary:active { transform: translateY(0); }
    </style>

    <div class="slb-wrap">

        <!-- Top bar -->
        <div class="slb-top">
            <div class="slb-heading">
                <div class="slb-icon-wrap">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <div class="slb-title">Chỉnh sửa lịch dạy bù</div>
                    <div class="slb-sub">Cập nhật thông tin buổi học bù</div>
                </div>
            </div>
            <a th:href="@{/lich-day-bu/{id}(id=${lichBu.id})}" class="slb-back">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="slb-card">

            <!-- Readonly strip -->
            <div class="slb-strip">
                <div class="slb-strip-item">
                    <div class="slb-strip-ico"><i class="bi bi-journal-bookmark"></i></div>
                    <div>
                        <div class="slb-strip-lbl">Lớp học phần</div>
                        <div class="slb-strip-val" th:text="${lichBu.lopHocPhan.maLhp}">OOP-01</div>
                        <div class="slb-strip-sub" th:text="${lichBu.lopHocPhan.monHoc?.tenMon ?: ''}">Lập trình hướng đối tượng</div>
                    </div>
                </div>
                <div class="slb-strip-item">
                    <div class="slb-strip-ico"><i class="bi bi-person-badge"></i></div>
                    <div>
                        <div class="slb-strip-lbl">Giảng viên</div>
                        <div class="slb-strip-val"
                             th:text="${lichBu.giangVien.hoTen ?: lichBu.giangVien.maNhanVien}">Nguyễn Văn A</div>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <div class="slb-body">
                <form th:action="@{/lich-day-bu/{id}/sua(id=${lichBu.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Thời gian -->
                    <div class="slb-section-lbl"><i class="bi bi-calendar3"></i> Thời gian</div>
                    <div class="slb-grid slb-grid-2">
                        <div class="slb-field">
                            <label>Ngày dạy bù <span class="req">*</span></label>
                            <input type="date" name="ngayDayBu" required
                                   th:value="${#temporals.format(lichBu.ngayDayBu,'yyyy-MM-dd')}"/>
                        </div>
                        <div class="slb-field">
                            <label>Thứ trong tuần <span class="req">*</span></label>
                            <select name="thuTrongTuan" required>
                                <option th:each="thu : ${thuList}"
                                        th:value="${thu}"
                                        th:text="${thu == 1 ? 'Chủ nhật' : 'Thứ ' + thu}"
                                        th:selected="${thu == lichBu.thuTrongTuan}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="slb-divider"></div>

                    <!-- Tiết học & phòng -->
                    <div class="slb-section-lbl"><i class="bi bi-clock"></i> Tiết học & phòng</div>
                    <div class="slb-grid slb-grid-3">
                        <div class="slb-field">
                            <label>Tiết bắt đầu <span class="req">*</span></label>
                            <div class="slb-num-wrap">
                                <input type="number" name="tietBatDau" min="1" max="12" required
                                       th:value="${lichBu.tietBatDau}" placeholder="1"/>
                                <span class="slb-num-badge">/ 12</span>
                            </div>
                            <div class="hint"><i class="bi bi-info-circle"></i> Tiết 1 → 12</div>
                        </div>
                        <div class="slb-field">
                            <label>Số tiết <span class="req">*</span></label>
                            <div class="slb-num-wrap">
                                <input type="number" name="soTiet" min="1" max="6" required
                                       th:value="${lichBu.soTiet}"/>
                                <span class="slb-num-badge">/ 6</span>
                            </div>
                        </div>
                        <div class="slb-field">
                            <label>Phòng học</label>
                            <select name="phongHoc">
                                <option value="">-- Chọn phòng --</option>
                                <option th:each="phong : ${danhSachPhong}"
                                        th:value="${phong.maPhong}"
                                        th:text="${phong.maPhong + ' (' + phong.tenPhong + ' - ' + phong.sucChua + ' chỗ)'}"
                                        th:selected="${phong.maPhong == lichBu.phongHoc}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="slb-divider"></div>

                    <!-- Ghi chú -->
                    <div class="slb-section-lbl"><i class="bi bi-chat-left-text"></i> Ghi chú</div>
                    <div class="slb-grid slb-grid-1">
                        <div class="slb-field">
                            <label>Nội dung ghi chú</label>
                            <textarea name="ghiChu" placeholder="Ghi chú thêm nếu có..."
                                      th:text="${lichBu.ghiChu}"></textarea>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="slb-actions">
                        <a th:href="@{/lich-day-bu/{id}(id=${lichBu.id})}" class="slb-btn slb-btn-ghost">
                            <i class="bi bi-x-lg"></i> Hủy
                        </a>
                        <button type="submit" class="slb-btn slb-btn-primary">
                            <i class="bi bi-check-lg"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
