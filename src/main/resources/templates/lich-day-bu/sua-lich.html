<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Chỉnh sửa lịch dạy bù')}">
<head><title>Chỉnh sửa lịch dạy bù</title></head>
<body>
<main>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root{
          --brand:#0f766e;--brand-light:#f0fdfa;--brand-dark:#0d9488;
          --surface:#fff;--bg:#f1f5f9;--text:#0f172a;--text-muted:#64748b;
          --border:#e2e8f0;--radius:14px;--radius-sm:8px;
          --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text)}

        .back-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
        .back-btn{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:600;
          color:var(--text-muted);text-decoration:none;padding:8px 14px;border-radius:var(--radius-sm);
          border:1px solid var(--border);background:var(--surface);transition:all .15s}
        .back-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-light)}
        .page-title{font-size:1.15rem;font-weight:700}
        .page-sub{font-size:.78rem;color:var(--text-muted);margin-top:2px}

        .form-wrap{max-width:780px;margin:0 auto}
        .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);
          box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);overflow:hidden}
        .card-head{padding:15px 22px;border-bottom:1px solid var(--border);
          display:flex;align-items:center;gap:8px}
        .card-head h6{font-size:.88rem;font-weight:700;color:var(--text);margin:0}
        .card-head i{color:var(--brand)}
        .card-body{padding:24px}

        /* Readonly info strip */
        .info-strip{background:#f8fafc;border-radius:var(--radius-sm);
          padding:14px 18px;margin-bottom:24px;
          display:grid;grid-template-columns:1fr 1fr;gap:12px;
          border:1px solid var(--border)}
        .strip-item{}
        .strip-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;
          letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px}
        .strip-val{font-size:.875rem;font-weight:600;color:var(--text)}
        .strip-sub{font-size:.75rem;color:var(--text-muted);margin-top:1px}

        /* Form fields */
        .row{display:grid;gap:16px}
        .col-2{grid-template-columns:1fr 1fr}
        .col-3{grid-template-columns:1fr 1fr 1fr}
        .col-1{grid-template-columns:1fr}
        @media(max-width:640px){.col-2,.col-3{grid-template-columns:1fr}}

        .field label{display:block;font-size:.8rem;font-weight:700;
          text-transform:uppercase;letter-spacing:.4px;
          color:var(--text-muted);margin-bottom:6px}
        .field label .req{color:#e11d48;margin-left:2px}
        .field input,.field select,.field textarea{
          width:100%;padding:10px 13px;border-radius:var(--radius-sm);
          border:1px solid var(--border);font-family:inherit;font-size:.875rem;
          color:var(--text);background:var(--surface);
          transition:border-color .15s,box-shadow .15s;outline:none}
        .field input:focus,.field select:focus,.field textarea:focus{
          border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
        .field textarea{resize:vertical;min-height:90px}
        .field .hint{font-size:.72rem;color:var(--text-muted);margin-top:5px}

        .divider{height:1px;background:var(--border);margin:20px 0}

        .form-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
        .btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:.875rem;
          font-weight:600;font-family:inherit;cursor:pointer;
          display:inline-flex;align-items:center;gap:7px;text-decoration:none;
          border:1px solid transparent;transition:all .15s}
        .btn-ghost{background:var(--surface);color:var(--text-muted);border-color:var(--border)}
        .btn-ghost:hover{background:#f8fafc;border-color:#94a3b8;color:var(--text)}
        .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
        .btn-primary:hover{background:var(--brand-dark)}
    </style>

    <div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="back-bar">
            <div>
                <div class="page-title">✏️ Chỉnh sửa lịch dạy bù</div>
                <div class="page-sub">Cập nhật thông tin buổi dạy bù</div>
            </div>
            <a th:href="@{/lich-day-bu/{id}(id=${lichBu.id})}" class="back-btn">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="form-wrap">
            <div class="card">
                <div class="card-head">
                    <i class="bi bi-pencil-square"></i>
                    <h6>Thông tin cần cập nhật</h6>
                </div>
                <div class="card-body">

                    <!-- Readonly strip -->
                    <div class="info-strip">
                        <div class="strip-item">
                            <div class="strip-lbl">Lớp học phần</div>
                            <div class="strip-val" th:text="${lichBu.lopHocPhan.maLhp}"></div>
                            <div class="strip-sub" th:text="${lichBu.lopHocPhan.monHoc?.tenMon ?: ''}"></div>
                        </div>
                        <div class="strip-item">
                            <div class="strip-lbl">Giảng viên</div>
                            <div class="strip-val" th:text="${lichBu.giangVien.hoTen ?: lichBu.giangVien.maNhanVien}"></div>
                        </div>
                    </div>

                    <form th:action="@{/lich-day-bu/{id}/sua(id=${lichBu.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row col-2">
                            <div class="field">
                                <label>Ngày dạy bù <span class="req">*</span></label>
                                <input type="date" name="ngayDayBu" required
                                       th:value="${#temporals.format(lichBu.ngayDayBu,'yyyy-MM-dd')}"/>
                            </div>
                            <div class="field">
                                <label>Thứ trong tuần <span class="req">*</span></label>
                                <select name="thuTrongTuan" required>
                                    <option th:each="thu : ${thuList}"
                                            th:value="${thu}"
                                            th:text="${thu == 1 ? 'Chủ nhật' : 'Thứ ' + thu}"
                                            th:selected="${thu == lichBu.thuTrongTuan}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row col-3">
                            <div class="field">
                                <label>Tiết bắt đầu <span class="req">*</span></label>
                                <input type="number" name="tietBatDau" min="1" max="12" required
                                       th:value="${lichBu.tietBatDau}" placeholder="1 – 12"/>
                            </div>
                            <div class="field">
                                <label>Số tiết <span class="req">*</span></label>
                                <input type="number" name="soTiet" min="1" max="6" required
                                       th:value="${lichBu.soTiet}"/>
                            </div>
                            <div class="field">
                                <label>Phòng học</label>
                                <input type="text" name="phongHoc" placeholder="VD: A101"
                                       th:value="${lichBu.phongHoc}"/>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row col-1">
                            <div class="field">
                                <label>Ghi chú</label>
                                <textarea name="ghiChu" placeholder="Ghi chú thêm (nếu có)"
                                          th:text="${lichBu.ghiChu}"></textarea>
                            </div>
                        </div>

                        <div class="form-actions">
                            <a th:href="@{/lich-day-bu/{id}(id=${lichBu.id})}" class="btn btn-ghost">
                                <i class="bi bi-x"></i> Hủy
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
