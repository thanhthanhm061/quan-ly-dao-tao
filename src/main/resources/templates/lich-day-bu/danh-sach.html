<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Lịch dạy bù')}">
<head><title>Lịch dạy bù</title></head>
<body>
<main>
    <div class="page-body">
        <!-- Giữ nguyên toàn bộ nội dung trong <div class="page-body"> cũ -->
        <!-- Chỉ fix th:classappend badge lồng ${} -->
        <div class="page-header-card">
            <div class="d-flex align-items-center gap-3">
                <span class="page-icon">🗓️</span>
                <div>
                    <h4 class="mb-0">Lịch dạy bù</h4>
                    <small class="text-muted">Quản lý các buổi dạy bù trong hệ thống</small>
                </div>
            </div>
            <a href="/lich-day-bu/xep" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Xếp lịch bù
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(danhSach)}" class="text-center py-5 text-muted">
                    <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>Chưa có lịch dạy bù nào.
                </div>
                <div th:unless="${#lists.isEmpty(danhSach)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th><th>Lớp học phần</th><th>Giảng viên</th>
                            <th>Ngày nghỉ gốc</th><th>Ngày dạy bù</th><th>Thứ</th>
                            <th>Tiết</th><th>Phòng</th><th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="lb, i : ${danhSach}">
                            <td th:text="${i.count}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${lb.lopHocPhan.maLhp}"></div>
                                <small class="text-muted" th:text="${lb.lopHocPhan.monHoc?.tenMon ?: ''}"></small>
                            </td>
                            <td th:text="${lb.giangVien.hoTen ?: lb.giangVien.maNhanVien}"></td>
                            <td th:text="${lb.ngayNghiGoc != null ? #temporals.format(lb.ngayNghiGoc,'dd/MM/yyyy') : '—'}"></td>
                            <td th:text="${#temporals.format(lb.ngayDayBu,'dd/MM/yyyy')}"></td>
                            <td th:text="${lb.tenThu}"></td>
                            <td th:text="${lb.tietBatDau + '–' + lb.tietKetThuc}"></td>
                            <td th:text="${lb.phongHoc ?: '—'}"></td>
                            <td>
                                <span th:classappend="${lb.trangThai.name() == 'DA_XEP'     ? 'badge-primary'  :
                                                       lb.trangThai.name() == 'HOAN_THANH' ? 'badge-success'  :
                                                       'badge-secondary'}"
                                      class="badge rounded-pill px-3 py-2"
                                      th:text="${lb.trangThai.tenHienThi}"></span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <a th:href="@{/lich-day-bu/{id}(id=${lb.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:if="${lb.trangThai.name() == 'DA_XEP'}"
                                       th:href="@{/lich-day-bu/{id}/sua(id=${lb.id})}"
                                       class="btn btn-sm btn-outline-secondary" title="Sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${lb.trangThai.name() == 'DA_XEP'}"
                                          th:action="@{/lich-day-bu/{id}/hoan-thanh(id=${lb.id})}"
                                          method="post" onsubmit="return confirm('Đánh dấu buổi này đã hoàn thành?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-success" title="Hoàn thành">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                    <form th:if="${lb.trangThai.name() == 'DA_XEP'}"
                                          th:action="@{/lich-day-bu/{id}/huy(id=${lb.id})}"
                                          method="post" onsubmit="return confirm('Hủy lịch dạy bù này?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Hủy">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
