<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::main}, 'Đơn xin nghỉ')}">
<head><title>Đơn xin nghỉ</title></head>
<body>
<main>
    <div class="page-body">

        <!-- Header -->
        <div class="page-header-card">
            <div class="d-flex align-items-center gap-3">
                <span class="page-icon">📋</span>
                <div>
                    <h4 class="mb-0">Đơn xin nghỉ của tôi</h4>
                    <small class="text-muted">Quản lý các đơn xin nghỉ phép, nghỉ bệnh...</small>
                </div>
            </div>
            <a href="/don-nghi/tao" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Tạo đơn mới
            </a>
        </div>


        <!-- Bảng danh sách -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(danhSach)}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    Bạn chưa có đơn xin nghỉ nào.
                </div>

                <div th:unless="${#lists.isEmpty(danhSach)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Loại nghỉ</th>
                            <th>Từ ngày</th>
                            <th>Đến ngày</th>
                            <th>Số ngày</th>
                            <th>Trạng thái</th>
                            <th>Ngày tạo</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="don, i : ${danhSach}">
                            <td th:text="${i.count}"></td>
                            <td th:text="${don.loaiNghi ?: 'Không rõ'}"></td>
                            <td th:text="${#temporals.format(don.ngayBatDau,'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(don.ngayKetThuc,'dd/MM/yyyy')}"></td>
                            <td th:text="${don.soNgayNghi + ' ngày'}"></td>
                            <td>
                                <span th:classappend="${don.trangThai.name() == 'CHO_DUYET' ? 'badge-warning' :
                                                       don.trangThai.name() == 'DA_DUYET'  ? 'badge-success' :
                                                       don.trangThai.name() == 'TU_CHOI'   ? 'badge-danger'  :
                                                       'badge-secondary'}"
                                      class="badge rounded-pill px-3 py-2"
                                      th:text="${don.trangThai.tenHienThi}">
                                </span>
                            </td>
                            <td th:text="${#temporals.format(don.ngayTao,'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <a th:href="@{/don-nghi/{id}(id=${don.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <form th:if="${don.coTheHuy}"
                                          th:action="@{/don-nghi/{id}/huy(id=${don.id})}"
                                          method="post"
                                          onsubmit="return confirm('Bạn chắc chắn muốn hủy đơn này?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                title="Hủy đơn">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>
</body>
</html>
