<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::main}, 'Chi tiết đơn xin nghỉ')}">
<head><title>Chi tiết đơn xin nghỉ</title></head>
<body>
<main>
    <div class="page-body">

        <!-- Header -->
        <div class="page-header-card">
            <div class="d-flex align-items-center gap-3">
                <span class="page-icon">📄</span>
                <div>
                    <h4 class="mb-0">Chi tiết đơn xin nghỉ</h4>
                    <small class="text-muted">Xem thông tin và thao tác với đơn xin nghỉ</small>
                </div>
            </div>
            <a th:href="@{/don-nghi}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Card chính -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white d-flex align-items-center justify-content-between py-3">
                        <h5 class="mb-0 fw-semibold">
                            <i class="bi bi-file-earmark-text me-2 text-primary"></i>
                            Đơn xin nghỉ
                            <span class="text-muted fw-normal fs-6 ms-2">#<span th:text="${don.id}"></span></span>
                        </h5>
                        <!-- Badge trạng thái -->
                        <span th:classappend="${don.trangThai.name() == 'CHO_DUYET' ? 'badge-warning' :
                                               don.trangThai.name() == 'DA_DUYET'  ? 'badge-success' :
                                               don.trangThai.name() == 'TU_CHOI'   ? 'badge-danger'  :
                                               don.trangThai.name() == 'DA_HUY'    ? 'badge-secondary' :
                                               'badge-info'}"
                              class="badge rounded-pill px-3 py-2 fs-6"
                              th:text="${don.trangThai.tenHienThi}">
                        </span>
                    </div>

                    <div class="card-body px-4 py-4">

                        <!-- Thông tin người nộp -->
                        <h6 class="text-uppercase text-muted small fw-bold mb-3">
                            <i class="bi bi-person-fill me-1"></i> Người nộp đơn
                        </h6>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Họ và tên</label>
                                <div class="fw-semibold" th:text="${don.nguoiNop?.hoTen ?: '—'}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Mã nhân viên</label>
                                <div class="fw-semibold" th:text="${don.nguoiNop?.maNhanVien ?: '—'}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Khoa / Bộ môn</label>
                                <div class="fw-semibold" th:text="${don.nguoiNop?.khoa?.tenKhoa ?: '—'}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Chức vụ</label>
                                <div class="fw-semibold" th:text="${don.nguoiNop?.chucVu?.tenChucVu ?: '—'}"></div>
                            </div>
                        </div>

                        <hr class="my-3"/>

                        <!-- Thông tin đơn -->
                        <h6 class="text-uppercase text-muted small fw-bold mb-3">
                            <i class="bi bi-calendar3 me-1"></i> Thông tin đơn
                        </h6>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Loại nghỉ</label>
                                <div class="fw-semibold" th:text="${don.loaiNghi ?: '—'}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Ngày nộp đơn</label>
                                <div class="fw-semibold"
                                     th:text="${#temporals.format(don.ngayTao, 'dd/MM/yyyy HH:mm')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Ngày bắt đầu nghỉ</label>
                                <div class="fw-semibold text-primary"
                                     th:text="${#temporals.format(don.ngayBatDau, 'dd/MM/yyyy')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Ngày kết thúc nghỉ</label>
                                <div class="fw-semibold text-primary"
                                     th:text="${#temporals.format(don.ngayKetThuc, 'dd/MM/yyyy')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted small mb-1">Số ngày nghỉ</label>
                                <div class="fw-bold fs-5 text-primary">
                                    <span th:text="${don.soNgayNghi}"></span>
                                    <span class="fs-6 fw-normal text-muted"> ngày</span>
                                </div>
                            </div>
                            <div class="col-sm-6"
                                 th:if="${don.fileDinhKem != null and !don.fileDinhKem.isEmpty()}">
                                <label class="form-label text-muted small mb-1">File đính kèm</label>
                                <div>
                                    <a th:href="${don.fileDinhKem}" target="_blank"
                                       class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-paperclip me-1"></i> Xem file
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Lý do xin nghỉ -->
                        <div class="mb-4">
                            <label class="form-label text-muted small mb-1">Lý do xin nghỉ</label>
                            <div class="bg-light rounded p-3 border" style="white-space: pre-wrap;"
                                 th:text="${don.lyDo ?: '—'}"></div>
                        </div>

                        <!-- Thông tin duyệt -->
                        <div th:if="${don.trangThai.name() == 'DA_DUYET' or don.trangThai.name() == 'TU_CHOI'}">
                            <hr class="my-3"/>
                            <h6 class="text-uppercase text-muted small fw-bold mb-3">
                                <i class="bi bi-person-check me-1"></i> Thông tin phê duyệt
                            </h6>
                            <div class="row g-3 mb-2">
                                <div class="col-sm-6" th:if="${don.nguoiDuyet != null}">
                                    <label class="form-label text-muted small mb-1">Người duyệt</label>
                                    <div class="fw-semibold" th:text="${don.nguoiDuyet.hoTen}"></div>
                                </div>
                                <div class="col-sm-6" th:if="${don.ngayDuyet != null}">
                                    <label class="form-label text-muted small mb-1">Ngày duyệt</label>
                                    <div class="fw-semibold"
                                         th:text="${#temporals.format(don.ngayDuyet, 'dd/MM/yyyy HH:mm')}"></div>
                                </div>
                                <div class="col-12"
                                     th:if="${don.trangThai.name() == 'TU_CHOI' and don.lyDoTuChoi != null}">
                                    <label class="form-label text-muted small mb-1">Lý do từ chối</label>
                                    <div class="bg-danger bg-opacity-10 border border-danger rounded p-3 text-danger"
                                         style="white-space: pre-wrap;"
                                         th:text="${don.lyDoTuChoi}"></div>
                                </div>
                            </div>
                        </div>

                    </div><!-- /card-body -->

                    <!-- Footer hành động -->
                    <div class="card-footer bg-white border-top py-3 px-4 d-flex flex-wrap gap-2 justify-content-end">

                        <!-- Người nộp: hủy khi đang chờ duyệt -->
                        <form th:if="${laNguoiNop and don.trangThai.name() == 'CHO_DUYET'}"
                              th:action="@{/don-nghi/{id}/huy(id=${don.id})}"
                              method="post"
                              onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn này?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-x-lg me-1"></i> Hủy đơn
                            </button>
                        </form>

                        <!-- Quản lý / Admin: duyệt và từ chối -->
                        <div th:if="${!laNguoiNop and don.trangThai.name() == 'CHO_DUYET'}"
                             class="d-flex gap-2">
                            <form th:action="@{/don-nghi/{id}/duyet(id=${don.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-lg me-1"></i> Duyệt
                                </button>
                            </form>
                            <button type="button" class="btn btn-danger"
                                    data-bs-toggle="modal" data-bs-target="#modalTuChoi">
                                <i class="bi bi-x-circle me-1"></i> Từ chối
                            </button>
                        </div>

                    </div><!-- /card-footer -->
                </div><!-- /card -->

            </div>
        </div>
    </div>

    <!-- Modal Từ Chối -->
    <div class="modal fade" id="modalTuChoi" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/don-nghi/{id}/tu-choi(id=${don.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title text-danger">
                            <i class="bi bi-x-circle-fill me-2"></i> Từ chối đơn nghỉ
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-muted small mb-3">
                            Vui lòng nhập lý do từ chối. Lý do này sẽ được gửi đến nhân viên.
                        </p>
                        <div class="mb-3">
                            <label for="lyDoTuChoi" class="form-label fw-semibold">
                                Lý do từ chối <span class="text-danger">*</span>
                            </label>
                            <textarea id="lyDoTuChoi" name="lyDoTuChoi" class="form-control" rows="4"
                                      placeholder="Nhập lý do từ chối..." required minlength="5"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-x-circle me-1"></i> Xác nhận từ chối
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</main>
</body>
</html>
