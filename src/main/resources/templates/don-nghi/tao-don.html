<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Tạo đơn xin nghỉ')}">
<head><title>Tạo đơn xin nghỉ</title></head>
<body>
<main>
    <div class="page-body">
        <div class="page-header-card">
            <div class="d-flex align-items-center gap-3">
                <a href="/don-nghi" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i></a>
                <div>
                    <h4 class="mb-0">Tạo đơn xin nghỉ</h4>
                    <small class="text-muted">Điền đầy đủ thông tin và gửi chờ phê duyệt</small>
                </div>
            </div>
        </div>

        <div class="card shadow-sm" style="max-width: 720px;">
            <div class="card-body p-4">
                <form action="/don-nghi/tao" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Loại nghỉ <span class="text-danger">*</span></label>
                        <select name="loaiNghi" class="form-select" required>
                            <option value="">-- Chọn loại nghỉ --</option>
                            <option th:each="loai : ${loaiNghiList}" th:value="${loai}" th:text="${loai}"></option>
                        </select>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày bắt đầu <span class="text-danger">*</span></label>
                            <input type="date" name="ngayBatDau" class="form-control" id="ngayBatDau" required
                                   th:value="${ngayBatDauDefault}"
                                   th:min="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày kết thúc <span class="text-danger">*</span></label>
                            <input type="date" name="ngayKetThuc" class="form-control" id="ngayKetThuc" required
                                   th:value="${ngayKetThucDefault}"
                                   th:min="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="alert alert-info py-2 px-3" id="soNgayInfo" style="display:none;">
                            <i class="bi bi-calendar3 me-2"></i>
                            Số ngày nghỉ: <strong id="soNgayText">0</strong> ngày
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Lý do <span class="text-danger">*</span></label>
                        <textarea name="lyDo" class="form-control" rows="4" maxlength="500" required
                                  placeholder="Nhập lý do xin nghỉ (tối đa 500 ký tự)..."></textarea>
                        <div class="form-text">Tối đa 500 ký tự</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">File đính kèm</label>
                        <input type="text" name="fileDinhKem" class="form-control"
                               placeholder="URL hoặc tên file (nếu có)"/>
                        <div class="form-text">Ví dụ: giấy bác sĩ, giấy tờ liên quan</div>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="/don-nghi" class="btn btn-outline-secondary">
                            <i class="bi bi-x me-1"></i> Hủy bỏ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i> Gửi đơn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        const batDau  = document.getElementById('ngayBatDau');
        const ketThuc = document.getElementById('ngayKetThuc');
        const info    = document.getElementById('soNgayInfo');
        const soNgay  = document.getElementById('soNgayText');
        function tinhSoNgay() {
            if (!batDau.value || !ketThuc.value) { info.style.display = 'none'; return; }
            const diff = Math.round((new Date(ketThuc.value) - new Date(batDau.value)) / 86400000) + 1;
            if (diff > 0) { soNgay.textContent = diff; info.style.display = 'block'; ketThuc.min = batDau.value; }
            else { info.style.display = 'none'; }
        }
        batDau.addEventListener('change', tinhSoNgay);
        ketThuc.addEventListener('change', tinhSoNgay);
    </script>
</main>
</body>
</html>
