<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::main}, 'Duyệt đơn nghỉ')}">
<head><title>Duyệt đơn nghỉ</title></head>
<body>
<main>
    <div class="page-body">
        <div class="page-header-card">
            <div class="d-flex align-items-center gap-3">
                <span class="page-icon">✅</span>
                <div>
                    <h4 class="mb-0">Phê duyệt đơn xin nghỉ</h4>
                    <small class="text-muted">Duyệt hoặc từ chối đơn của nhân viên trong khoa</small>
                </div>
            </div>
            <form method="get" action="/don-nghi/duyet" class="d-flex gap-2 align-items-center">
                <select name="trangThai" class="form-select form-select-sm" style="width:180px;"
                        onchange="this.form.submit()">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option th:each="tt : ${trangThaiList}"
                            th:value="${tt.name()}"
                            th:text="${tt.tenHienThi}"
                            th:selected="${tt == trangThaiFilter}">
                    </option>
                </select>
            </form>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(danhSach)}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    Không có đơn nào cần xử lý.
                </div>
                <div th:unless="${#lists.isEmpty(danhSach)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th><th>Người nộp</th><th>Khoa</th><th>Loại nghỉ</th>
                            <th>Từ ngày</th><th>Đến ngày</th><th>Số ngày</th>
                            <th>Trạng thái</th><th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="don, i : ${danhSach}">
                            <td th:text="${i.count}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${don.nguoiNop.hoTen ?: don.nguoiNop.maNhanVien}"></div>
                                <small class="text-muted" th:text="${don.nguoiNop.chucVu?.tenChucVu ?: ''}"></small>
                            </td>
                            <td th:text="${don.nguoiNop.khoa?.tenKhoa ?: '—'}"></td>
                            <td th:text="${don.loaiNghi ?: '—'}"></td>
                            <td th:text="${#temporals.format(don.ngayBatDau,'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(don.ngayKetThuc,'dd/MM/yyyy')}"></td>
                            <td th:text="${don.soNgayNghi + ' ngày'}"></td>
                            <td>
                                <span th:classappend="${don.trangThai.name() == 'CHO_DUYET' ? 'badge-warning' :
                                                       don.trangThai.name() == 'DA_DUYET'  ? 'badge-success' :
                                                       don.trangThai.name() == 'TU_CHOI'   ? 'badge-danger'  :
                                                       'badge-secondary'}"
                                      class="badge rounded-pill px-3 py-2"
                                      th:text="${don.trangThai.tenHienThi}"></span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <a th:href="@{/don-nghi/{id}(id=${don.id})}"
                                       class="btn btn-sm btn-outline-primary" title="Xem chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <form th:if="${don.trangThai.name() == 'CHO_DUYET'}"
                                          th:action="@{/don-nghi/{id}/duyet(id=${don.id})}"
                                          method="post"
                                          onsubmit="return confirm('Xác nhận duyệt đơn này?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-success" title="Duyệt">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                    <button th:if="${don.trangThai.name() == 'CHO_DUYET'}"
                                            class="btn btn-sm btn-danger" title="Từ chối"
                                            th:data-id="${don.id}"
                                            onclick="moModalTuChoi(this.dataset.id)">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal từ chối -->
    <div class="modal fade" id="modalTuChoi" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formTuChoi" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header">
                        <h5 class="modal-title">Từ chối đơn nghỉ</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label fw-semibold">Lý do từ chối <span class="text-danger">*</span></label>
                        <textarea name="lyDoTuChoi" class="form-control" rows="3"
                                  required maxlength="300" placeholder="Nhập lý do từ chối..."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-x-lg me-1"></i> Xác nhận từ chối
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function moModalTuChoi(donId) {
            document.getElementById('formTuChoi').action = '/don-nghi/' + donId + '/tu-choi';
            new bootstrap.Modal(document.getElementById('modalTuChoi')).show();
        }
    </script>
</main>
</body>
</html>
