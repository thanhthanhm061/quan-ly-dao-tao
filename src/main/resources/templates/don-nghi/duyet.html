<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::main}, 'Duyệt đơn nghỉ')}">

<head>
    <title>Duyệt đơn nghỉ</title>
</head>

<body>
<main>
    <div class="page-body">

        <!-- HEADER -->
        <div class="page-header-card shadow-sm rounded-3 p-3 mb-3 bg-white d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0">Phê duyệt đơn xin nghỉ</h4>
                <small class="text-muted">Duyệt hoặc từ chối đơn của nhân viên</small>
            </div>

            <!-- FILTER -->
            <form method="get" action="/don-nghi/duyet" class="d-flex gap-2">
                <select name="trangThai"
                        class="form-select form-select-sm shadow-sm"
                        style="min-width:200px"
                        onchange="this.form.submit()">

                    <option value="">-- Tất cả trạng thái --</option>

                    <option th:each="tt : ${trangThaiList}"
                            th:value="${tt.name()}"
                            th:text="${tt.tenHienThi}"
                            th:selected="${tt == trangThaiFilter}">
                    </option>
                </select>
            </form>
        </div>

        <!-- ALERT -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- TABLE CARD -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

            <div class="card-body p-0">

                <!-- EMPTY -->
                <div th:if="${#lists.isEmpty(danhSach)}"
                     class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    Không có đơn nào cần xử lý
                </div>

                <!-- TABLE -->
                <div th:unless="${#lists.isEmpty(danhSach)}" class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Người nộp</th>
                            <th>Khoa</th>
                            <th>Loại nghỉ</th>
                            <th>Từ</th>
                            <th>Đến</th>
                            <th>Số ngày</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="don, i : ${danhSach}">

                            <td th:text="${i.count}"></td>

                            <td>
                                <div class="fw-semibold"
                                     th:text="${don.nguoiNop.hoTen ?: don.nguoiNop.maNhanVien}">
                                </div>
                                <small class="text-muted"
                                       th:text="${don.nguoiNop.chucVu?.tenChucVu ?: ''}">
                                </small>
                            </td>

                            <td th:text="${don.nguoiNop.khoa?.tenKhoa ?: '—'}"></td>

                            <td th:text="${don.loaiNghi ?: '—'}"></td>

                            <td th:text="${#temporals.format(don.ngayBatDau,'dd/MM/yyyy')}"></td>

                            <td th:text="${#temporals.format(don.ngayKetThuc,'dd/MM/yyyy')}"></td>

                            <td class="fw-semibold text-primary"
                                th:text="${don.soNgayNghi + ' ngày'}"></td>

                            <!-- BADGE -->
                            <td>
                            <span class="badge rounded-pill px-3 py-2 shadow-sm"
                                  th:classappend="${don.trangThai.name() == 'CHO_DUYET' ? 'bg-warning text-dark' :
                                                   don.trangThai.name() == 'DA_DUYET'  ? 'bg-success' :
                                                   don.trangThai.name() == 'TU_CHOI'   ? 'bg-danger' :
                                                   'bg-secondary'}"
                                  th:text="${don.trangThai.tenHienThi}">
                            </span>
                            </td>

                            <!-- ACTION -->
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">

                                    <!-- XEM -->
                                    <a th:href="@{/don-nghi/{id}(id=${don.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i>
                                    </a>

                                    <!-- DUYỆT -->
                                    <form th:if="${don.trangThai.name() == 'CHO_DUYET'}"
                                          th:action="@{/don-nghi/{id}/duyet(id=${don.id})}"
                                          method="post">

                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>

                                        <button type="submit"
                                                class="btn btn-sm btn-success">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>

                                    <!-- TỪ CHỐI -->
                                    <button th:if="${don.trangThai.name() == 'CHO_DUYET'}"
                                            class="btn btn-sm btn-danger"
                                            th:data-id="${don.id}"
                                            onclick="moModalTuChoi(this.dataset.id)">
                                        <i class="bi bi-x-lg"></i>
                                    </button>

                                </div>
                            </td>

                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>

    </div>

    <!-- MODAL TỪ CHỐI -->
    <div class="modal fade" id="modalTuChoi" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow-lg">

                <form id="formTuChoi" method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="modal-header border-0">
                        <h5 class="text-danger mb-0">
                            <i class="bi bi-x-circle me-1"></i>
                            Từ chối đơn nghỉ
                        </h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <label class="form-label fw-semibold">
                            Lý do từ chối <span class="text-danger">*</span>
                        </label>

                        <textarea name="lyDoTuChoi"
                                  class="form-control"
                                  rows="4"
                                  required
                                  maxlength="300"
                                  placeholder="Nhập lý do từ chối..."></textarea>
                    </div>

                    <div class="modal-footer border-0">
                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button type="submit"
                                class="btn btn-danger">
                            Xác nhận
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        function moModalTuChoi(id) {
            document.getElementById('formTuChoi').action = '/don-nghi/' + id + '/tu-choi';
            new bootstrap.Modal(document.getElementById('modalTuChoi')).show();
        }
    </script>

</main>
</body>
</html>
