<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content}, ${tieuDe})}">

<th:block th:fragment="content">

    <style>

        body{
            background:#f1f5f9;
        }

        .form-card{
            border:none;
            border-radius:24px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .form-header{
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            color:white;
            padding:22px 28px;
        }

        .form-title{
            font-size:24px;
            font-weight:700;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .form-control,
        .form-select{
            border-radius:14px;
            min-height:46px;
            border:1px solid #dbe2ea;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.08);
        }

        textarea.form-control{
            min-height:100px;
        }

        .form-label{
            font-weight:600;
            margin-bottom:8px;
            color:#334155;
        }

        .card-body{
            padding:32px;
        }

        .btn{
            border-radius:12px;
            padding:10px 18px;
            font-weight:600;
        }

        .form-switch .form-check-input{
            width:48px;
            height:24px;
        }

        .section-title{
            font-size:18px;
            font-weight:700;
            margin-bottom:22px;
            color:#0f172a;
        }

    </style>

    <div class="container-fluid px-4">

        <div class="card form-card">

            <!-- HEADER -->

            <div class="form-header d-flex justify-content-between align-items-center">

                <div class="form-title">

                    <i class="fas fa-building"></i>

                    <span th:text="${tieuDe}">
                        Khoa
                    </span>

                </div>

                <a th:href="@{/admin/khoa}"
                   class="btn btn-light text-primary">

                    <i class="fas fa-arrow-left me-1"></i>
                    Quay lại

                </a>

            </div>

            <!-- BODY -->

            <div class="card-body">

                <div class="section-title">
                    Thông tin khoa / viện
                </div>

                <form th:action="${khoa.id == null ? '/admin/khoa/them' : '/admin/khoa/sua/' + khoa.id}"
                      th:object="${khoa}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="row g-4">

                        <!-- MÃ KHOA -->

                        <div class="col-md-4">

                            <label class="form-label">

                                Mã khoa
                                <span class="text-danger">*</span>

                            </label>

                            <input type="text"
                                   th:field="*{maKhoa}"
                                   class="form-control"
                                   placeholder="VD: CNTT"
                                   maxlength="20"
                                   th:readonly="${khoa.id != null}"
                                   th:classappend="${#fields.hasErrors('maKhoa')} ? 'is-invalid'"/>

                            <div class="invalid-feedback"
                                 th:errors="*{maKhoa}">
                            </div>

                        </div>

                        <!-- TÊN KHOA -->

                        <div class="col-md-8">

                            <label class="form-label">

                                Tên khoa / viện
                                <span class="text-danger">*</span>

                            </label>

                            <input type="text"
                                   th:field="*{tenKhoa}"
                                   class="form-control"
                                   placeholder="VD: Khoa Công Nghệ Thông Tin"
                                   th:classappend="${#fields.hasErrors('tenKhoa')} ? 'is-invalid'"/>

                            <div class="invalid-feedback"
                                 th:errors="*{tenKhoa}">
                            </div>

                        </div>

                        <!-- MÔ TẢ -->

                        <div class="col-12">

                            <label class="form-label">
                                Mô tả
                            </label>

                            <textarea th:field="*{moTa}"
                                      class="form-control"
                                      placeholder="Nhập mô tả ngắn về khoa...">
                            </textarea>

                        </div>

                        <!-- NGÀY -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Ngày thành lập
                            </label>

                            <input type="date"
                                   th:field="*{ngayThanhLap}"
                                   class="form-control"/>

                        </div>

                        <!-- SĐT -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <input type="text"
                                   th:field="*{soDienThoai}"
                                   class="form-control"
                                   placeholder="VD: 0236xxxxxxx"/>

                        </div>

                        <!-- EMAIL -->

                        <div class="col-md-4">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="khoa@truong.edu.vn"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>

                            <div class="invalid-feedback"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <!-- ĐỊA CHỈ -->

                        <div class="col-12">

                            <label class="form-label">
                                Địa chỉ
                            </label>

                            <input type="text"
                                   th:field="*{diaChi}"
                                   class="form-control"
                                   placeholder="Nhập địa chỉ khoa"/>

                        </div>

                        <!-- TRẠNG THÁI -->

                        <div class="col-md-6">

                            <label class="form-label d-block">
                                Trạng thái
                            </label>

                            <div class="form-check form-switch">

                                <input class="form-check-input"
                                       type="checkbox"
                                       role="switch"
                                       th:field="*{trangThai}"
                                       id="trangThai"/>

                                <label class="form-check-label"
                                       for="trangThai">

                                    Đang hoạt động

                                </label>

                            </div>

                        </div>

                    </div>

                    <!-- BUTTON -->

                    <div class="d-flex justify-content-end gap-2 mt-5">

                        <a th:href="@{/admin/khoa}"
                           class="btn btn-outline-secondary">

                            <i class="fas fa-times me-1"></i>
                            Hủy

                        </a>

                        <button type="submit"
                                class="btn btn-primary px-4">

                            <i class="fas fa-save me-1"></i>

                            <span th:text="${khoa.id == null ? 'Thêm khoa' : 'Lưu thay đổi'}">
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</th:block>

</html>
