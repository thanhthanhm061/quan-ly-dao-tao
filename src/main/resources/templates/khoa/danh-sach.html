<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content}, 'Quản lý khoa')}">

<th:block th:fragment="content">

    <style>

        body{
            background:#f8fafc;
        }

        .page-wrap{
            padding:24px 0;
        }

        /* ===== TOPBAR ===== */

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .topbar-left h3{
            margin:0;
            font-size:26px;
            font-weight:700;
            color:#0f172a;
        }

        .topbar-left p{
            margin:4px 0 0;
            color:#64748b;
            font-size:14px;
        }

        .btn-add{
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:12px;
            padding:10px 18px;
            font-size:14px;
            font-weight:600;
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:8px;
            transition:.2s;
        }

        .btn-add:hover{
            background:#1d4ed8;
            color:#fff;
        }

        /* ===== STATS ===== */

        .stats-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:16px;
            margin-bottom:22px;
        }

        .stat-card{
            background:#fff;
            border-radius:18px;
            padding:18px;
            border:1px solid #e2e8f0;
            box-shadow:0 4px 14px rgba(15,23,42,.04);
        }

        .stat-label{
            color:#64748b;
            font-size:13px;
            margin-bottom:8px;
        }

        .stat-value{
            font-size:30px;
            font-weight:700;
            color:#0f172a;
            line-height:1;
        }

        .stat-sub{
            margin-top:6px;
            font-size:12px;
            color:#94a3b8;
        }

        /* ===== MAIN CARD ===== */

        .main-card{
            background:#fff;
            border-radius:22px;
            overflow:hidden;
            border:1px solid #e2e8f0;
            box-shadow:0 8px 30px rgba(15,23,42,.05);
        }

        .card-header-custom{
            padding:20px 24px;
            border-bottom:1px solid #f1f5f9;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            flex-wrap:wrap;
        }

        .card-title{
            display:flex;
            align-items:center;
            gap:10px;
            font-size:18px;
            font-weight:700;
            color:#0f172a;
        }

        .badge-total{
            background:#eff6ff;
            color:#2563eb;
            border-radius:999px;
            padding:5px 12px;
            font-size:12px;
            font-weight:700;
        }

        /* ===== SEARCH ===== */

        .search-box{
            position:relative;
            width:280px;
        }

        .search-box input{
            width:100%;
            height:42px;
            border:1px solid #dbe2ea;
            border-radius:12px;
            padding:0 42px 0 14px;
            outline:none;
            font-size:14px;
            background:#fff;
            transition:.2s;
        }

        .search-box input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.08);
        }

        .search-box i{
            position:absolute;
            top:50%;
            right:14px;
            transform:translateY(-50%);
            color:#94a3b8;
            font-size:14px;
        }

        /* ===== TABLE ===== */

        .table-responsive{
            overflow:auto;
        }

        .table{
            margin:0;
        }

        .table thead{
            background:#f8fafc;
        }

        .table thead th{
            border:none;
            padding:16px;
            font-size:13px;
            font-weight:700;
            color:#64748b;
            white-space:nowrap;
        }

        .table tbody td{
            padding:16px;
            vertical-align:middle;
            border-color:#f1f5f9;
            font-size:14px;
        }

        .table tbody tr:hover{
            background:#fafcff;
        }

        /* ===== COLUMN STYLE ===== */

        .code-badge{
            background:#eff6ff;
            color:#2563eb;
            padding:7px 12px;
            border-radius:10px;
            font-weight:700;
            font-size:13px;
            display:inline-block;
            min-width:70px;
            text-align:center;
        }

        .khoa-name{
            font-weight:700;
            color:#0f172a;
            margin-bottom:3px;

            display:-webkit-box;
            -webkit-line-clamp:1;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }

        .khoa-desc{
            color:#94a3b8;
            font-size:12px;

            display:-webkit-box;
            -webkit-line-clamp:1;
            -webkit-box-orient:vertical;
            overflow:hidden;
            max-width:260px;
        }

        .count-pill{
            background:#f1f5f9;
            color:#475569;
            padding:6px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
        }

        .status-active{
            background:#dcfce7;
            color:#15803d;
            padding:6px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
        }

        .status-stop{
            background:#fee2e2;
            color:#b91c1c;
            padding:6px 12px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
        }

        /* ===== ACTION ===== */

        .action-group{
            display:flex;
            justify-content:center;
            gap:8px;
        }

        .action-btn{
            width:36px;
            height:36px;
            border-radius:10px;
            display:flex;
            align-items:center;
            justify-content:center;
            border:1px solid #e2e8f0;
            background:#fff;
            color:#64748b;
            transition:.2s;
            text-decoration:none;
        }

        .action-btn:hover{
            background:#f8fafc;
        }

        .action-btn.view:hover{
            background:#eff6ff;
            border-color:#bfdbfe;
            color:#2563eb;
        }

        .action-btn.edit:hover{
            background:#fffbeb;
            border-color:#fde68a;
            color:#d97706;
        }

        .action-btn.delete:hover{
            background:#fef2f2;
            border-color:#fecaca;
            color:#dc2626;
        }

        /* ===== EMPTY ===== */

        .empty-box{
            padding:70px 20px;
            text-align:center;
            color:#94a3b8;
        }

        .empty-box i{
            font-size:48px;
            margin-bottom:14px;
            display:block;
        }

        /* ===== ALERT ===== */

        .alert{
            border:none;
            border-radius:14px;
        }

        /* ===== RESPONSIVE ===== */

        @media(max-width:768px){

            .topbar-left h3{
                font-size:22px;
            }

            .search-box{
                width:100%;
            }

            .table thead th,
            .table tbody td{
                padding:12px;
            }

        }

    </style>

    <div class="container-fluid px-4">

        <!-- ALERT -->

        <div th:if="${thanhCong}"
             class="alert alert-success alert-dismissible fade show mt-3">

            <i class="fas fa-check-circle me-2"></i>

            <span th:text="${thanhCong}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>

        </div>

        <div th:if="${loiLam}"
             class="alert alert-danger alert-dismissible fade show mt-3">

            <i class="fas fa-exclamation-triangle me-2"></i>

            <span th:text="${loiLam}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"></button>

        </div>

        <div class="page-wrap">

            <!-- TOPBAR -->

            <div class="topbar">

                <div class="topbar-left">

                    <h3>
                        <i class="fas fa-building text-primary me-2"></i>
                        Quản lý khoa
                    </h3>

                    <p>
                        Quản lý danh sách khoa / viện trong hệ thống
                    </p>

                </div>

                <a th:href="@{/admin/khoa/them}"
                   class="btn-add">

                    <i class="fas fa-plus"></i>
                    Thêm khoa

                </a>

            </div>

            <!-- STATS -->

            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-label">Tổng khoa</div>
                    <div class="stat-value"
                         th:text="${tongSo}">0</div>
                    <div class="stat-sub">khoa / viện</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Hoạt động</div>
                    <div class="stat-value text-success"
                         th:text="${soHoatDong}">0</div>
                    <div class="stat-sub">đang hoạt động</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Tạm dừng</div>
                    <div class="stat-value text-danger"
                         th:text="${soTamDung}">0</div>
                    <div class="stat-sub">đã tạm dừng</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Nhân viên</div>
                    <div class="stat-value"
                         th:text="${tongNhanVien}">0</div>
                    <div class="stat-sub">tổng nhân viên</div>
                </div>

            </div>

            <!-- TABLE CARD -->

            <div class="main-card">

                <!-- HEADER -->

                <div class="card-header-custom">

                    <div class="card-title">

                        <i class="fas fa-list text-primary"></i>

                        Danh sách khoa

                        <span class="badge-total"
                              th:text="${tongSo}">
                            0
                        </span>

                    </div>

                    <div class="search-box">

                        <input type="text"
                               id="searchInput"
                               placeholder="Tìm tên khoa...">

                        <i class="fas fa-search"></i>

                    </div>

                </div>

                <!-- TABLE -->

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                        <tr>

                            <th>#</th>
                            <th>Mã khoa</th>
                            <th>Tên khoa</th>
                            <th>SĐT</th>
                            <th>Email</th>
                            <th>Thành lập</th>
                            <th class="text-center">NV</th>
                            <th class="text-center">Trạng thái</th>
                            <th class="text-center">Thao tác</th>

                        </tr>

                        </thead>

                        <tbody id="khoaTable">

                        <!-- EMPTY -->

                        <tr th:if="${#lists.isEmpty(dsKhoa)}">

                            <td colspan="9">

                                <div class="empty-box">

                                    <i class="fas fa-folder-open"></i>

                                    Chưa có dữ liệu khoa

                                </div>

                            </td>

                        </tr>

                        <!-- DATA -->

                        <tr th:each="k, stat : ${dsKhoa}"
                            class="khoa-row">

                            <td th:text="${stat.count}"></td>

                            <td>
                                <span class="code-badge"
                                      th:text="${k.maKhoa}">
                                </span>
                            </td>

                            <td>

                                <div class="khoa-name"
                                     th:text="${k.tenKhoa}">
                                </div>

                                <div class="khoa-desc"
                                     th:if="${k.moTa != null}"
                                     th:text="${#strings.abbreviate(k.moTa,60)}">
                                </div>

                            </td>

                            <td th:text="${k.soDienThoai ?: '—'}"></td>

                            <td>

                                <a th:if="${k.email != null}"
                                   th:href="'mailto:' + ${k.email}"
                                   th:text="${k.email}"
                                   class="text-decoration-none">
                                </a>

                                <span th:unless="${k.email != null}">
                                    —
                                </span>

                            </td>

                            <td>

                                <span th:if="${k.ngayThanhLap != null}"
                                      th:text="${#temporals.format(k.ngayThanhLap,'dd/MM/yyyy')}">
                                </span>

                                <span th:unless="${k.ngayThanhLap != null}">
                                    —
                                </span>

                            </td>

                            <td class="text-center">

                                <span class="count-pill"
                                      th:text="${k.soNhanVien}">
                                </span>

                            </td>

                            <td class="text-center">

                                <span th:if="${k.trangThai}"
                                      class="status-active">

                                    Hoạt động

                                </span>

                                <span th:unless="${k.trangThai}"
                                      class="status-stop">

                                    Tạm dừng

                                </span>

                            </td>

                            <td>

                                <div class="action-group">

                                    <!-- VIEW -->

                                    <a th:href="@{/admin/khoa/chi-tiet/{id}(id=${k.id})}"
                                       class="action-btn view">

                                        <i class="fas fa-eye"></i>

                                    </a>

                                    <!-- EDIT -->

                                    <a th:href="@{/admin/khoa/sua/{id}(id=${k.id})}"
                                       class="action-btn edit">

                                        <i class="fas fa-edit"></i>

                                    </a>

                                    <!-- DELETE -->

                                    <form th:action="@{/admin/khoa/xoa/{id}(id=${k.id})}"
                                          method="post"
                                          onsubmit="return confirm('Bạn có chắc muốn xóa khoa này?')">

                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>

                                        <button type="submit"
                                                class="action-btn delete">

                                            <i class="fas fa-trash"></i>

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- SEARCH SCRIPT -->

    <script>

        const searchInput = document.getElementById("searchInput");

        searchInput?.addEventListener("keyup", function () {

            const keyword = this.value.toLowerCase();

            const rows = document.querySelectorAll(".khoa-row");

            rows.forEach(row => {

                const name = row.querySelector(".khoa-name")
                    .innerText
                    .toLowerCase();

                row.style.display = name.includes(keyword)
                    ? ""
                    : "none";

            });

        });

    </script>

</th:block>

</html>
