<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content}, 'Quản lý Lớp học')}">
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:fragment="content">

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center class-header">
           <span class="d-flex align-items-center gap-2">
    <i class="fas fa-door-open"></i>
    Danh sách Lớp học
    <span class="badge rounded-pill bg-white text-primary fw-bold"
          id="lopCountBadge"
          th:text="${#lists.size(lops)}"
          style="font-size:13px; min-width:28px">0</span>
</span>

            <a th:href="@{/admin/lop/them}" class="btn btn-light btn-sm add-btn">
                <i class="fas fa-plus me-1"></i>Thêm mới
            </a>
        </div>

        <div class="card-body p-0">

            <!-- FILTER -->
            <div class="p-3 border-bottom bg-light">
                <div class="row g-2 align-items-center">

                    <!-- Search -->
                    <div class="col-md-4">
                        <div class="search-box">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text"
                                   id="searchInput"
                                   class="form-control search-input"
                                   placeholder="Tìm mã hoặc tên lớp...">
                        </div>
                    </div>

                    <!-- Niên khóa -->
                    <div class="col-md-2">
                        <select id="filterNienKhoa" class="form-select filter-select">
                            <option value="">Tất cả khóa</option>
                        </select>
                    </div>

                    <!-- Khoa -->
                    <div class="col-md-3">
                        <select id="filterKhoa" class="form-select filter-select">
                            <option value="">Tất cả khoa</option>
                        </select>
                    </div>

                    <!-- Cố vấn -->
                    <div class="col-md-3">
                        <select id="filterCvht" class="form-select filter-select">
                            <option value="">Tất cả cố vấn</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã lớp</th>
                        <th>Tên lớp</th>
                        <th>Niên khóa</th>
                        <th>Khoa</th>
                        <th>Cố vấn HT</th>
                        <th>Sĩ số</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(lops)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="fas fa-inbox fa-2x d-block mb-2"></i>
                            Không có dữ liệu
                        </td>
                    </tr>

                    <tr th:each="lop,i : ${lops}"
                        th:data-ma="${lop.maLop}"
                        th:data-ten="${lop.tenLop}"
                        th:data-nienkhoa="${lop.nienKhoa}"
                        th:data-khoa="${lop.khoa != null ? lop.khoa.tenKhoa : ''}"
                        th:data-cvht="${lop.coVanHocTap != null ? lop.coVanHocTap.hoTenVaHocVi : ''}">
                        <td th:text="${i.count}"></td>
                        <td><code th:text="${lop.maLop}"></code></td>
                        <td class="fw-semibold" th:text="${lop.tenLop}"></td>
                        <td th:text="${lop.nienKhoa}"></td>
                        <td class="small"
                            th:text="${lop.khoa != null ? lop.khoa.tenKhoa : '-'}"></td>

                        <td class="small">
                            <span th:if="${lop.coVanHocTap != null}"
                                  class="badge bg-light text-dark border"
                                  th:text="${lop.coVanHocTap.hoTenVaHocVi}">
                            </span>
                            <span th:if="${lop.coVanHocTap == null}" class="text-muted">—</span>
                        </td>

                        <td>
                            <button type="button"
                                    class="badge bg-light text-dark border si-so-btn"
                                    style="cursor:pointer;border:none"
                                    th:data-lop-id="${lop.id}"
                                    th:data-ma-lop="${lop.maLop}"
                                    th:data-ten-lop="${lop.tenLop}"
                                    th:data-cvht="${lop.coVanHocTap != null ? lop.coVanHocTap.hoTenVaHocVi : ''}"
                                    th:text="${lop.sinhViens != null ? #lists.size(lop.sinhViens) : 0} + ' SV'">
                            </button>
                        </td>

                        <td>
                            <div class="action-group">

                                <a th:href="@{/admin/lop/sua/{id}(id=${lop.id})}"
                                   class="action-btn action-btn-edit"
                                   title="Chỉnh sửa">
                                    <i class="fas fa-pen-to-square"></i>
                                </a>

                                <form th:action="@{/admin/lop/xoa/{id}(id=${lop.id})}"
                                      method="post"
                                      class="d-inline delete-form"
                                      th:data-ten="${lop.tenLop}">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <button type="submit"
                                            class="action-btn action-btn-delete"
                                            title="Xóa">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL SINH VIÊN ==================== -->
    <div class="modal fade" id="modalSinhVien" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow-sm" style="border-radius:12px;overflow:hidden">

                <!-- HEADER -->
                <div class="modal-header border-bottom py-3 px-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-3 bg-primary bg-opacity-10 d-flex align-items-center justify-content-center"
                             style="width:38px;height:38px">
                            <i class="fas fa-users text-primary"></i>
                        </div>

                        <div>
                            <!-- Tên lớp -->
                            <h6 class="modal-title mb-0 fw-semibold" id="modalLopTen"></h6>
                            <!-- Mã lớp -->
                            <small class="text-muted d-block" id="modalLopMa"></small>
                            <!-- Cố vấn học tập (ẩn mặc định, hiện khi có dữ liệu) -->
                            <small class="text-muted d-block" id="modalLopCvht" style="display:none!important">
                                <i class="fas fa-chalkboard-teacher me-1 opacity-50"></i>
                                Cố vấn: <span id="modalLopCvhtTen" class="fw-semibold"></span>
                            </small>
                        </div>
                    </div>

                    <!-- Badge đếm tổng SV -->


                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- SEARCH BAR TRONG MODAL -->
                <div class="px-4 py-2 border-bottom bg-light">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="fas fa-search text-muted"></i>
                        </span>
                        <input type="text"
                               id="modalSearch"
                               class="form-control border-start-0"
                               placeholder="Tìm mã SV hoặc họ tên..."
                               oninput="filterModalSV()"
                               style="border-radius:0 8px 8px 0">
                    </div>
                </div>

                <!-- BODY -->
                <div class="modal-body p-0">
                    <!-- Loading -->
                    <div id="modalLoading" class="text-center py-5">
                        <div class="spinner-border spinner-border-sm text-secondary me-2"></div>
                        <span class="text-muted small">Đang tải...</span>
                    </div>

                    <!-- Empty -->
                    <div id="modalEmpty" class="text-center text-muted py-5" style="display:none">
                        <i class="fas fa-inbox fa-2x d-block mb-2 opacity-25"></i>
                        <small>Lớp chưa có sinh viên nào</small>
                    </div>

                    <!-- Table -->
                    <div style="max-height:360px;overflow-y:auto">
                        <table class="table table-hover mb-0 align-middle"
                               id="modalTable"
                               style="display:none;font-size:13px">
                            <thead class="table-light sticky-top">
                            <tr>
                                <th>#</th>
                                <th>Mã SV</th>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>SĐT</th>
                            </tr>
                            </thead>
                            <tbody id="modalBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- FOOTER: đếm kết quả tìm kiếm -->
                <div class="modal-footer py-2 px-4 bg-light border-top">
                    <small class="text-muted" id="modalFooterCount"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="custom-toast-container"></div>

    <style>
        /* =========================
           SEARCH
        ========================= */
        .search-box{
            position:relative;
        }

        .search-icon{
            position:absolute;
            left:14px;
            top:50%;
            transform:translateY(-50%);
            color:#94a3b8;
            font-size:14px;
            pointer-events:none;
        }

        .search-input{
            padding-left:42px;
            border-radius:14px;
            border:1px solid #dbeafe;
            height:44px;
            background:#f8fafc;
            transition:all .18s ease;
        }

        .search-input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.12);
            background:#fff;
        }

        /* =========================
           FILTER
        ========================= */
        .filter-select{
            border-radius:14px;
            border:1px solid #dbeafe;
            height:44px;
            background:#f8fafc;
            transition:all .18s ease;
        }

        .filter-select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.12);
            background:#fff;
        }

        /* =========================
           HEADER
        ========================= */
        .class-header{
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            color:#fff;
            padding:16px 22px;
            border:none;
        }

        .class-header span,
        .class-header i{
            color:#fff;
            font-weight:600;
        }

        /* =========================
           ADD BUTTON
        ========================= */
        .add-btn{
            background:#fff;
            color:#2563eb !important;
            font-weight:600;
            border:none;
            border-radius:10px;
            padding:6px 14px;
            transition:all .18s ease;
        }

        .add-btn:hover{
            background:#eff6ff;
            color:#1d4ed8 !important;
            transform:translateY(-1px);
        }

        /* =========================
           TABLE
        ========================= */
        .table thead{
            background:#eff6ff;
        }

        .table thead th{
            color:#1e3a8a;
            font-size:13px;
            font-weight:700;
            border-bottom:none;
            white-space:nowrap;
        }

        .table tbody tr{
            transition:all .18s ease;
        }

        .table tbody tr:hover{
            background:#f8fbff;
        }

        .table td{
            vertical-align:middle;
        }

        /* code mã lớp */
        .table code{
            background:#eff6ff;
            color:#1d4ed8;
            padding:4px 9px;
            border-radius:7px;
            font-size:12px;
            font-weight:700;
        }

        /* =========================
           BADGE
        ========================= */
        .badge.bg-light{
            background:#f8fafc !important;
            border:1px solid #e2e8f0 !important;
        }

        /* =========================
           SĨ SỐ BUTTON
        ========================= */
        .si-so-btn{
            border-radius:999px !important;
            padding:7px 14px !important;
            background:#eff6ff !important;
            color:#1d4ed8 !important;
            border:none !important;
            font-weight:600;
            transition:all .18s ease;
        }

        .si-so-btn:hover{
            background:#1d4ed8 !important;
            color:#fff !important;
            transform:translateY(-1px);
        }

        /* =========================
   ACTION BUTTONS
   FIX ICON + ĐỒNG ĐỀU
========================= */

.action-group{
    display:flex;
    align-items:center;
    gap:8px;
}

/* reset button/form */
.action-group form{
    margin:0;
}

.action-btn{
    width:36px;
    height:36px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:11px;

    text-decoration:none;

    transition:all .18s ease;

    padding:0;

    cursor:pointer;
}

/* icon */
.action-btn i{
    font-size:13px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ======================
   EDIT
====================== */
.action-btn-edit{
    background:#fff7ed;
    color:#ea580c;
    border:1px solid #fed7aa;
}

.action-btn-edit:hover{
    background:#ea580c;
    border-color:#ea580c;
    color:#fff;
    transform:translateY(-1px);
}

/* ======================
   DELETE
====================== */
.action-btn-delete{
    background:#fef2f2;
    color:#dc2626;
    border:1px solid #fecaca;
}

.action-btn-delete:hover{
    background:#dc2626;
    border-color:#dc2626;
    color:#fff;
    transform:translateY(-1px);
}

/* fix button mặc định */
.action-btn-delete:focus,
.action-btn-edit:focus{
    outline:none;
    box-shadow:none;
}

/* fix icon lệch */
.action-btn-delete i,
.action-btn-edit i{
    pointer-events:none;
}
        /* =========================
           TOAST DELETE
        ========================= */

        /* blur overlay */
        .delete-overlay{
            position:fixed;
            inset:0;

            backdrop-filter:blur(7px);
            -webkit-backdrop-filter:blur(7px);

            background:rgba(15,23,42,.22);

            opacity:0;
            visibility:hidden;

            transition:all .2s ease;

            z-index:9998;
        }

        .delete-overlay.show{
            opacity:1;
            visibility:visible;
        }

        /* toast container */
        .custom-toast-container{
            position:fixed;
            inset:0;

            display:flex;
            align-items:center;
            justify-content:center;

            z-index:99999;

            pointer-events:none;
        }

        /* toast */
        .custom-toast{
            width:380px;
            max-width:calc(100vw - 24px);

            background:#fff;

            border-radius:20px;

            box-shadow:
                0 20px 40px rgba(0,0,0,.18),
                0 2px 10px rgba(0,0,0,.08);

            overflow:hidden;

            border:1px solid #fee2e2;

            transform:translateY(10px) scale(.96);
            opacity:0;

            animation:toastShow .22s ease forwards;

            pointer-events:auto;
        }

        @keyframes toastShow{
            to{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        .toast-header-custom{
            display:flex;
            gap:14px;
            padding:22px 22px 16px;
        }

        .toast-icon{
            width:46px;
            height:46px;

            border-radius:14px;

            background:#fee2e2;
            color:#dc2626;

            display:flex;
            align-items:center;
            justify-content:center;

            flex-shrink:0;

            font-size:18px;
        }

        .toast-title{
            font-size:16px;
            font-weight:700;
            color:#0f172a;
        }

        .toast-message{
            font-size:13px;
            color:#64748b;
            margin-top:4px;
            line-height:1.5;
        }

        /* actions */
        .toast-actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;

            padding:0 22px 22px;
        }

        .toast-btn{
            border:none;

            min-width:92px;
            height:40px;

            border-radius:12px;

            font-size:13px;
            font-weight:600;

            cursor:pointer;

            transition:all .18s ease;
        }

        .toast-btn-cancel{
            background:#f1f5f9;
            color:#475569;
        }

        .toast-btn-cancel:hover{
            background:#e2e8f0;
        }

        .toast-btn-confirm{
            background:#dc2626;
            color:#fff;
        }

        .toast-btn-confirm:hover{
            background:#b91c1c;
        }

      /* =========================
   MODAL SINH VIÊN
========================= */

#modalSinhVien .modal-dialog{
    max-width: 980px;
}

#modalSinhVien .modal-content{
    border:none;
    border-radius:24px !important;
    overflow:hidden;
    box-shadow:
        0 25px 60px rgba(15,23,42,.18),
        0 4px 18px rgba(15,23,42,.08);
    background:#fff;
}

/* =========================
   HEADER
========================= */

#modalSinhVien .modal-header{
    border:none;
    padding:22px 26px;
    background:
        linear-gradient(
            135deg,
            #1e3a8a 0%,
            #2563eb 100%
        );
    color:#fff;
    position:relative;
}
#modalSinhVien .modal-header::after{
    content:"";
    position:absolute;
    inset:auto -40px -40px auto;

    width:140px;
    height:140px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    pointer-events:none; /* FIX */
}

#modalSinhVien .btn-close{
    filter:brightness(0) invert(1);
    opacity:.9;

    position:relative;
    z-index:10;
}
#modalSinhVien .modal-title{
    color:#fff;
    font-size:18px;
    font-weight:700;
}

#modalSinhVien #modalLopMa,
#modalSinhVien #modalLopCvht{
    color:rgba(255,255,255,.82) !important;
}

#modalSinhVien .btn-close{
    filter:brightness(0) invert(1);
    opacity:.9;
}

#modalSinhVien .btn-close:hover{
    opacity:1;
}

/* icon users */
#modalSinhVien .modal-header .rounded-3{
    width:52px !important;
    height:52px !important;

    border-radius:16px !important;

    background:rgba(255,255,255,.16) !important;

    backdrop-filter:blur(6px);
}

#modalSinhVien .modal-header .rounded-3 i{
    color:#fff !important;
    font-size:18px;
}

/* badge */
#modalBadgeCount{
    background:#fff !important;
    color:#1d4ed8 !important;

    font-weight:700;
    font-size:14px !important;

    padding:9px 14px;

    border-radius:999px !important;

    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

/* =========================
   SEARCH BAR
========================= */

#modalSinhVien .input-group{
    background:#fff;
    border-radius:14px;
    overflow:hidden;

    border:1px solid #dbeafe;

    transition:all .18s ease;
}

#modalSinhVien .input-group:focus-within{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

#modalSinhVien .input-group-text{
    border:none !important;
    background:#fff !important;

    border:none !important;
    box-shadow:none !important;

    height:42px;

    font-size:14px;

}

   BODY
========================= */

#modalSinhVien .modal-body{
    background:#f8fafc;
}

/* =========================
   TABLE
========================= */

#modalTable{
    background:#fff;
    border-collapse:separate;
    border-spacing:0;
}

#modalTable thead{
    position:sticky;

    z-index:5;
}

    background:#eff6ff !important;

    color:#1e3a8a;

    font-size:12px;

    border:none !important;

}

#modalTable tbody tr:hover{
    background:#f8fbff;

}

    border-color:#eef2f7 !important;

    padding:14px 16px;

    vertical-align:middle;

}

/* tên SV */

    color:#0f172a;
    font-size:13px;
}

/* =========================
   LOADING + EMPTY
========================= */

#modalEmpty{
    background:#fff;
    margin:18px;

    border:1px dashed #dbeafe;
}

#modalLoading{
    padding:50px 20px !important;
}

    padding:60px 20px !important;
}

/* =========================
   FOOTER
========================= */

    background:#fff;

    color:#64748b !important;

   SCROLLBAR
========================= */

    width:8px;

    background:#cbd5e1;

}

   RESPONSIVE
========================= */

    #modalSinhVien .modal-dialog{
        margin:12px;
    }

    #modalSinhVien .modal-footer{

        min-width:720px;
    }

        width:46px !important;
        height:46px !important;

    </style>

    <script>
        let _allSvs = [];

        /* ── Avatar chữ cái ── */
        function initials(name) {
            const parts = name.trim().split(' ');
            return parts.length >= 2
                ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
                : name[0].toUpperCase();
        }

        /* ── Render danh sách SV vào bảng modal ── */
        function renderModalRows(list) {
            document.getElementById('modalBody').innerHTML = list.map((sv, i) => `
                <tr>
                    <td class="text-muted">${i + 1}</td>
                    <td>
                        <code class="bg-light border rounded px-2 py-1" style="font-size:11px">
                            ${sv.maSv}
                        </code>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="rounded-circle bg-primary bg-opacity-10 text-primary
                                        d-flex align-items-center justify-content-center flex-shrink-0"
                                 style="width:28px;height:28px;font-size:10px;font-weight:600">
                                ${initials(sv.hoTen)}
                            </div>
                            <span class="fw-semibold">${sv.hoTen}</span>
                        </div>
                    </td>
                    <td class="text-muted">${sv.email || '-'}</td>
                    <td class="text-muted">${sv.sdt  || '-'}</td>
                </tr>
            `).join('');

            document.getElementById('modalFooterCount').textContent =
                `Hiển thị ${list.length} / ${_allSvs.length} sinh viên`;
        }

        /* ── Tìm kiếm SV trong modal ── */
        function filterModalSV() {
            const q = document.getElementById('modalSearch').value.toLowerCase();
            renderModalRows(
                _allSvs.filter(sv =>
                    sv.hoTen.toLowerCase().includes(q) ||
                    sv.maSv.toLowerCase().includes(q)
                )
            );
        }

       /* ── Mở modal sĩ số ── */
document.querySelectorAll('.si-so-btn').forEach(btn => {

    btn.addEventListener('click', async function () {

        const lopId  = this.dataset.lopId;
        const maLop  = this.dataset.maLop;
        const tenLop = this.dataset.tenLop;
        const cvht   = this.dataset.cvht;

        /* Reset */
        _allSvs = [];

        document.getElementById('modalLopTen').textContent =
            tenLop;

        document.getElementById('modalLopMa').textContent =
            'Mã lớp: ' + maLop;

        document.getElementById('modalSearch').value = '';

        document.getElementById('modalFooterCount').textContent = '';

        /* loading */
        document.getElementById('modalLoading').style.display = 'block';

        /* table */
        document.getElementById('modalTable').style.display = 'none';

        /* empty */
        document.getElementById('modalEmpty').style.display = 'none';

        /* clear body */
        document.getElementById('modalBody').innerHTML = '';

        /* CVHT */
        const cvhtEl = document.getElementById('modalLopCvht');

        if (cvht && cvht.trim() !== '') {

            document.getElementById('modalLopCvhtTen').textContent = cvht;

            cvhtEl.style.display = 'block';

        } else {

            cvhtEl.style.display = 'none';
        }

        /* Bootstrap modal */
        const modalEl = document.getElementById('modalSinhVien');

        const modal =
            bootstrap.Modal.getOrCreateInstance(modalEl);

        modal.show();

        try {

            const response =
                await fetch(`/admin/lop/${lopId}/sinh-vien`);

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const svs = await response.json();

            _allSvs = svs;

            /* TẮT loading */
            document.getElementById('modalLoading').style.display = 'none';

            if (!svs || svs.length === 0) {

                document.getElementById('modalEmpty').style.display = 'block';

                document.getElementById('modalFooterCount').textContent =
                    '0 sinh viên';

                return;
            }

            renderModalRows(svs);

            document.getElementById('modalTable').style.display = 'table';

        } catch (err) {

            document.getElementById('modalLoading').style.display = 'none';

            document.getElementById('modalEmpty').style.display = 'block';

            document.getElementById('modalEmpty').innerHTML = `
                <i class="fas fa-exclamation-circle text-danger fa-2x mb-2"></i>
                <div class="text-danger small">
                    Lỗi tải dữ liệu: ${err.message}
                </div>
            `;
        }
    });
});
document.getElementById('modalSinhVien')
    .addEventListener('hidden.bs.modal', function () {

        document.getElementById('modalLoading').style.display = 'none';

        document.getElementById('modalTable').style.display = 'none';

        document.getElementById('modalEmpty').style.display = 'none';

        document.getElementById('modalBody').innerHTML = '';

        document.getElementById('modalSearch').value = '';
});
        /* ── Toast xác nhận xóa ── */
        function showDeleteToast(title, message, onConfirm) {

    /* tạo blur nền */
    const overlay = document.createElement('div');
    overlay.className = 'delete-overlay';
    document.body.appendChild(overlay);

/* trigger animation mượt */
requestAnimationFrame(() => {
    overlay.classList.add('show');
});

    const container = document.querySelector('.custom-toast-container');
    container.innerHTML = '';

    const toast = document.createElement('div');

    toast.className = 'custom-toast';

    toast.innerHTML = `
        <div class="toast-header-custom">
            <div class="toast-icon">
                <i class="fas fa-trash"></i>
            </div>

            <div>
                <div class="fw-bold">${title}</div>
                <div class="text-muted small">${message}</div>
            </div>
        </div>

        <div class="toast-actions">
            <button class="toast-btn toast-btn-cancel">
                Hủy
            </button>

            <button class="toast-btn toast-btn-confirm">
                Xóa
            </button>
        </div>
    `;

    container.appendChild(toast);

    function closeToast(){

    overlay.classList.remove('show');

    setTimeout(() => {
        toast.remove();
        overlay.remove();
    }, 180);
}

    toast.querySelector('.toast-btn-cancel').onclick = closeToast;

    overlay.onclick = closeToast;

    toast.querySelector('.toast-btn-confirm').onclick = () => {
        closeToast();
        onConfirm();
    };
}
/* ── BẮT SỰ KIỆN XOÁ ── */
document.querySelectorAll('.delete-form').forEach(form => {

    form.addEventListener('submit', function (e) {

        e.preventDefault();

        showDeleteToast(
            'Xác nhận xóa',
            `Bạn có chắc muốn xóa lớp "${this.dataset.ten}"?`,
            () => this.submit()
        );

    });

});
        /* ── Populate filter dropdowns ── */
        function populateFilters() {
            const rows = document.querySelectorAll('tbody tr');
            const nienKhoas = new Set();
            const khoas     = new Set();
            const cvhts     = new Set();

            rows.forEach(row => {
                if (row.querySelector('td[colspan]')) return;
                nienKhoas.add(row.dataset.nienkhoa);
                khoas.add(row.dataset.khoa);
                cvhts.add(row.dataset.cvht);
            });

            fillSelect('filterNienKhoa', nienKhoas);
            fillSelect('filterKhoa',     khoas);
            fillSelect('filterCvht',     cvhts);
        }

        function fillSelect(id, values) {
            const select = document.getElementById(id);
            [...values].sort().forEach(v => {
                if (!v) return;
                const opt = document.createElement('option');
                opt.value       = v;
                opt.textContent = v;
                select.appendChild(opt);
            });
        }

        /* ── Lọc bảng ── */
        function filterTable() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const nk      = document.getElementById('filterNienKhoa').value;
            const khoa    = document.getElementById('filterKhoa').value;
            const cvht    = document.getElementById('filterCvht').value;
            const visible = [...document.querySelectorAll('tbody tr')]
                .filter(r => !r.id && !r.querySelector('td[colspan]') && r.style.display !== 'none').length;
            document.getElementById('lopCountBadge').textContent = visible;
            const rows = document.querySelectorAll('tbody tr');
            let hasResult = false;

            rows.forEach(row => {
                if (row.id === 'noResultRow' || row.querySelector('td[colspan]')) return;

                const matchSearch =
                    (row.dataset.ma  || '').toLowerCase().includes(keyword) ||
                    (row.dataset.ten || '').toLowerCase().includes(keyword);

                const matchNk   = !nk   || row.dataset.nienkhoa === nk;
                const matchKhoa = !khoa || row.dataset.khoa      === khoa;
                const matchCvht = !cvht || row.dataset.cvht      === cvht;

                if (matchSearch && matchNk && matchKhoa && matchCvht) {
                    row.style.display = '';
                    hasResult = true;
                } else {
                    row.style.display = 'none';
                }
            });

            let emptyRow = document.getElementById('noResultRow');
            if (!hasResult) {
                if (!emptyRow) {
                    emptyRow = document.createElement('tr');
                    emptyRow.id = 'noResultRow';
                    emptyRow.innerHTML = `
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="fas fa-search-minus fa-2x d-block mb-2 opacity-50"></i>
                            Không tìm thấy lớp phù hợp
                        </td>
                    `;
                    document.querySelector('tbody').appendChild(emptyRow);
                }
            } else {
                if (emptyRow) emptyRow.remove();
            }
        }

        document.getElementById('searchInput').addEventListener('keyup', filterTable);
        document.getElementById('filterNienKhoa').addEventListener('change', filterTable);
        document.getElementById('filterKhoa').addEventListener('change', filterTable);
        document.getElementById('filterCvht').addEventListener('change', filterTable);

        populateFilters();
    </script>
