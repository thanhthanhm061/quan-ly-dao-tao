<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Quản lý Chức Vụ')}">

<title>Quản lý Chức Vụ</title>

<main>
    <div class="container-fluid px-4">

        <div th:if="${thanhCong}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${thanhCong}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${loiLam}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${loiLam}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex align-items-center justify-content-between py-3 mb-2 border-bottom">
            <div>
                <h4 class="mb-0 fw-bold">
                    Quản Lý Chức Vụ / Vị Trí
                </h4>

                <small class="text-muted">
                    Tổng:
                    <strong th:text="${tongSo}">0</strong>
                    chức vụ
                </small>
            </div>

            <a th:href="@{/admin/chuc-vu/them}"
               class="btn btn-warning text-white">
                Thêm Chức Vụ
            </a>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">

                <form method="get"
                      th:action="@{/admin/chuc-vu}"
                      class="input-group">

                    <input type="text"
                           name="search"
                           class="form-control"
                           th:value="${timKiem}"
                           placeholder="Tìm theo tên chức vụ..."/>

                    <button class="btn btn-outline-secondary"
                            type="submit">
                        Tìm
                    </button>

                </form>

            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-warning">
                    <tr>
                        <th>#</th>
                        <th>Mã</th>
                        <th>Tên Chức Vụ</th>
                        <th>Cấp Bậc</th>
                        <th>Khoa</th>
                        <th>Trạng Thái</th>
                        <th class="text-center">Thao Tác</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="cv, stat : ${dsChucVu}">
                        <td th:text="${stat.count}"></td>

                        <td th:text="${cv.maChucVu}"></td>

                        <td th:text="${cv.tenChucVu}"></td>

                        <td th:text="${cv.capBac}"></td>

                        <td>
                            <span th:if="${cv.khoa != null}"
                                  th:text="${cv.khoa.tenKhoa}">
                            </span>

                            <span th:if="${cv.khoa == null}">
                                Cấp trường
                            </span>
                        </td>

                        <td>
                            <span th:if="${cv.trangThai}"
                                  class="badge bg-success">
                                Hoạt động
                            </span>

                            <span th:unless="${cv.trangThai}"
                                  class="badge bg-secondary">
                                Dừng
                            </span>
                        </td>

                        <td class="text-center">

                            <a th:href="@{/admin/chuc-vu/sua/{id}(id=${cv.id})}"
                               class="btn btn-sm btn-warning">
                                Sửa
                            </a>

                            <form th:action="@{/admin/chuc-vu/xoa/{id}(id=${cv.id})}"
                                  method="post"
                                  class="d-inline">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button type="submit"
                                        class="btn btn-sm btn-danger">
                                    Xóa
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(dsChucVu)}">
                        <td colspan="7"
                            class="text-center py-4">
                            Chưa có dữ liệu
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>

    </div>
</main>

</html>
