<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main}, 'Chức Vụ')}">

<main>

    <div class="container-fluid px-4">

        <!-- Tiêu đề -->
        <div class="d-flex justify-content-between align-items-center py-3 mb-3 border-bottom">

            <h4 class="mb-0 fw-bold"
                th:text="${tieuDe}">
                Chức vụ
            </h4>

            <a th:href="@{/admin/chuc-vu}"
               class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>
                Quay lại
            </a>

        </div>

        <!-- Card Form -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <form th:action="${chucVu.id == null
                                    ? '/admin/chuc-vu/them'
                                    : '/admin/chuc-vu/sua/' + chucVu.id}"
                      th:object="${chucVu}"
                      method="post">

                    <!-- CSRF -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <!-- Mã chức vụ -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Mã chức vụ
                        </label>

                        <input type="text"
                               th:field="*{maChucVu}"
                               class="form-control"
                               placeholder="Nhập mã chức vụ"/>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('maChucVu')}"
                             th:errors="*{maChucVu}">
                        </div>

                    </div>

                    <!-- Tên chức vụ -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Tên chức vụ
                        </label>

                        <input type="text"
                               th:field="*{tenChucVu}"
                               class="form-control"
                               placeholder="Nhập tên chức vụ"/>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('tenChucVu')}"
                             th:errors="*{tenChucVu}">
                        </div>

                    </div>

                    <!-- Cấp bậc -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Cấp bậc
                        </label>

                        <select th:field="*{capBac}"
                                class="form-select">

                            <option value="">
                                -- Chọn cấp bậc --
                            </option>

                            <option th:each="cb : ${dsCapBac}"
                                    th:value="${cb}"
                                    th:text="${cb}">
                            </option>

                        </select>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('capBac')}"
                             th:errors="*{capBac}">
                        </div>

                    </div>

                    <!-- Khoa -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Khoa
                        </label>

                        <!-- FIX -->
                        <select th:field="*{khoa.id}"
                                class="form-select">

                            <option value="">
                                -- Không thuộc khoa --
                            </option>

                            <option th:each="k : ${dsKhoa}"
                                    th:value="${k.id}"
                                    th:text="${k.tenKhoa}">
                            </option>

                        </select>

                    </div>

                    <!-- Mô tả -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Mô tả
                        </label>

                        <textarea th:field="*{moTa}"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Nhập mô tả chức vụ">
                        </textarea>

                    </div>

                    <!-- Trạng thái -->
                    <div class="form-check form-switch mb-4">

                        <input class="form-check-input"
                               type="checkbox"
                               th:field="*{trangThai}"/>

                        <label class="form-check-label">
                            Hoạt động
                        </label>

                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-warning text-white">

                            <i class="fas fa-save me-1"></i>
                            Lưu

                        </button>

                        <a th:href="@{/admin/chuc-vu}"
                           class="btn btn-outline-secondary">

                            Hủy

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

</html>
